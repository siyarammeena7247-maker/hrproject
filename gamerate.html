

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rate Data - HR MATKA</title>

<style>

/* =====================================================
   HR MATKA USER APP
   GAME RATE / RATE DATA PAGE

   Connected With:
   Admin Panel -> ratelist.html

   LocalStorage:
   rates
===================================================== */


/* =====================================================
   1. BASIC RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:#eeeeee;

    color:#111;

    min-height:100vh;

    padding-bottom:105px;

}


/* =====================================================
   2. MAIN APP
===================================================== */

.app{

    width:100%;

    max-width:760px;

    margin:auto;

}


/* =====================================================
   3. TOP HEADER
===================================================== */

.header{

    height:100px;

    background:#ffffff;

    display:flex;

    align-items:center;

    padding:0 28px;

    gap:28px;

    box-shadow:
    0 3px 10px rgba(0,0,0,.12);

    position:sticky;

    top:0;

    z-index:100;

}


/* BACK BUTTON */

.backButton{

    border:none;

    background:none;

    font-size:46px;

    line-height:1;

    cursor:pointer;

    color:#111;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* PAGE TITLE */

.pageTitle{

    font-size:32px;

    font-weight:800;

}


/* =====================================================
   4. RATE MAIN CARD
===================================================== */

.rateContainer{

    margin:18px 16px;

    background:#ffffff;

    border-radius:24px;

    padding:30px;

    box-shadow:
    0 5px 18px rgba(0,0,0,.18);

}


/* =====================================================
   5. RATE HEADING
===================================================== */

.rateHeading{

    display:flex;

    align-items:center;

    gap:20px;

    margin-bottom:26px;

}


/* RATE LOGO CIRCLE */

.rateIconCircle{

    width:76px;

    height:76px;

    border-radius:50%;

    background:#f1f8eb;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

}


/* BLUE RATE ICON */

.rateIconCircle svg{

    width:40px;

    height:40px;

}


.rateHeadingText{

    font-size:29px;

    font-weight:900;

}


/* =====================================================
   6. RATE ROW
===================================================== */

.rateRow{

    min-height:96px;

    background:#f7f8fa;

    border:1px solid #e1e3e6;

    border-radius:17px;

    margin-bottom:10px;

    padding:15px 24px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:14px;

}


/* GAME NAME */

.gameName{

    font-size:25px;

    font-weight:900;

}


/* RATE VALUE */

.rateValue{

    border:2px solid #4caf60;

    color:#49ad58;

    border-radius:26px;

    padding:9px 15px;

    font-size:23px;

    font-weight:700;

    white-space:nowrap;

    background:#f5fff5;

}


/* =====================================================
   7. EMPTY / ERROR MESSAGE
===================================================== */

.infoMessage{

    display:none;

    padding:14px;

    margin-top:15px;

    border-radius:12px;

    background:#fff3cd;

    color:#805f00;

    text-align:center;

    font-weight:bold;

}


/* =====================================================
   8. BOTTOM NAVIGATION

   SAME 5 BUTTONS ON USER APP PAGES
===================================================== */

.bottomNav{

    position:fixed;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:100%;

    max-width:760px;

    height:96px;

    background:#191919;

    border-radius:22px 22px 0 0;

    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    align-items:center;

    z-index:1000;

    border:1px solid #343434;

    box-shadow:
    0 -4px 15px rgba(0,0,0,.20);

}


/* BOTTOM BUTTON */

.navItem{

    height:100%;

    border:none;

    background:transparent;

    color:#ffffff;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    cursor:pointer;

}


/* BOTTOM ICON */

.navIcon{

    font-size:31px;

    line-height:1;

}


/* BOTTOM TEXT */

.navText{

    font-size:15px;

    font-weight:800;

}


/* =====================================================
   9. HOME ROUND BUTTON
===================================================== */

.homeItem{

    position:relative;

}


.homeCircle{

    width:75px;

    height:75px;

    border-radius:50%;

    background:#e4bb12;

    border:4px solid #ffd900;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#ffffff;

    font-size:38px;

    box-shadow:
    0 3px 10px rgba(0,0,0,.30);

}


/* =====================================================
   10. MOBILE RESPONSIVE
===================================================== */

@media(max-width:600px){

    body{

        padding-bottom:88px;

    }


    .header{

        height:86px;

        padding:0 20px;

        gap:20px;

    }


    .backButton{

        font-size:38px;

    }


    .pageTitle{

        font-size:27px;

    }


    .rateContainer{

        margin:16px 14px;

        padding:25px 20px;

        border-radius:21px;

    }


    .rateIconCircle{

        width:66px;

        height:66px;

    }


    .rateIconCircle svg{

        width:35px;

        height:35px;

    }


    .rateHeading{

        gap:16px;

    }


    .rateHeadingText{

        font-size:24px;

    }


    .rateRow{

        min-height:85px;

        padding:13px 17px;

    }


    .gameName{

        font-size:21px;

    }


    .rateValue{

        font-size:19px;

        padding:8px 12px;

    }


    .bottomNav{

        height:82px;

        border-radius:18px 18px 0 0;

    }


    .navIcon{

        font-size:25px;

    }


    .navText{

        font-size:12px;

    }


    .homeCircle{

        width:67px;

        height:67px;

        font-size:32px;

    }

}


/* =====================================================
   11. VERY SMALL MOBILE
===================================================== */

@media(max-width:390px){

    .rateContainer{

        padding:20px 12px;

    }


    .rateRow{

        padding:12px 12px;

    }


    .gameName{

        font-size:18px;

    }


    .rateValue{

        font-size:16px;

        padding:7px 9px;

    }


    .rateHeadingText{

        font-size:21px;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <button
    class="backButton"
    onclick="goBack()"
    type="button">

        ←

    </button>


    <div class="pageTitle">

        Rate Data

    </div>

</header>



<!-- =====================================================
     RATE CARD
===================================================== -->

<div class="rateContainer">


    <!-- RATE TITLE -->

    <div class="rateHeading">


        <!-- SAME STYLE RATE ICON -->

        <div class="rateIconCircle">

            <svg
            viewBox="0 0 64 64"
            aria-hidden="true">

                <rect
                x="17"
                y="18"
                width="30"
                height="7"
                rx="3"
                fill="none"
                stroke="#2196f3"
                stroke-width="4"/>

                <rect
                x="11"
                y="29"
                width="42"
                height="7"
                rx="3"
                fill="none"
                stroke="#2196f3"
                stroke-width="4"/>

                <rect
                x="20"
                y="40"
                width="24"
                height="7"
                rx="3"
                fill="none"
                stroke="#2196f3"
                stroke-width="4"/>

            </svg>

        </div>


        <div class="rateHeadingText">

            Game Win Ratio for all Bids

        </div>

    </div>



    <!-- =================================================
         SINGLE RATE
    ================================================== -->

    <div class="rateRow">

        <div class="gameName">

            Single

        </div>

        <div
        class="rateValue"
        id="singleRate">

            1Rs ka 9Rs

        </div>

    </div>



    <!-- =================================================
         JODI RATE
    ================================================== -->

    <div class="rateRow">

        <div class="gameName">

            Jodi

        </div>

        <div
        class="rateValue"
        id="jodiRate">

            1Rs ka 90Rs

        </div>

    </div>



    <!-- =================================================
         SINGLE PANNA RATE
    ================================================== -->

    <div class="rateRow">

        <div class="gameName">

            Single Panna

        </div>

        <div
        class="rateValue"
        id="singlePannaRate">

            1Rs ka 140Rs

        </div>

    </div>



    <!-- =================================================
         DOUBLE PANNA RATE
    ================================================== -->

    <div class="rateRow">

        <div class="gameName">

            Double Panna

        </div>

        <div
        class="rateValue"
        id="doublePannaRate">

            1Rs ka 280Rs

        </div>

    </div>



    <!-- =================================================
         TRIPLE PANNA RATE
    ================================================== -->

    <div class="rateRow">

        <div class="gameName">

        </div>

        <div
        class="rateValue"
        id="triplePannaRate">

            1Rs ka 600Rs

        </div>

    </div>



    <!-- =================================================
         HALF SANGAM RATE
    ================================================== -->

    <div class="rateRow">

        <div class="gameName">

            Half Sangam

        </div>

        <div
        class="rateValue"
        id="halfSangamRate">

            1Rs ka 1000Rs

        </div>

    </div>



    <!-- =================================================
         FULL SANGAM RATE
    ================================================== -->

    <div class="rateRow">

        <div class="gameName">

            Full Sangam

        </div>

        <div
        class="rateValue"
        id="fullSangamRate">

            1Rs ka 10000Rs

        </div>

    </div>


    <div
    id="infoMessage"
    class="infoMessage">

        Admin Rate List Not Found

    </div>


</div>


</div>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottomNav">


    <!-- MY BID -->

    <button
    class="navItem"
    onclick="goPage('mybid.html')"
    type="button">

        <div class="navIcon">

            🎯

        </div>

        <div class="navText">

            My Bid

        </div>

    </button>



    <!-- PASSBOOK -->

    <button
    class="navItem"
    onclick="goPage('history.html')"
    type="button">

        <div class="navIcon">

            📒

        </div>

        <div class="navText">

            Passbook

        </div>

    </button>



    <!-- HOME -->

    <button
    class="navItem homeItem"
    onclick="goPage('index.html')"
    type="button">

        <div class="homeCircle">

            🏠

        </div>

    </button>



    <!-- FUND -->

    <button
    class="navItem"
    onclick="goPage('fund.html')"
    type="button">

        <div class="navIcon">

            💰

        </div>

        <div class="navText">

            Fund

        </div>

    </button>



    <!-- CHART -->

    <button
    class="navItem"
    onclick="goPage('chart.html')"
    type="button">

        <div class="navIcon">

            📊

        </div>

        <div class="navText">

            Chart

        </div>

    </button>


</nav>




<script>

/* =====================================================
   HR MATKA
   USER GAME RATE PAGE

   ADMIN CONNECTION:
   ratelist.html
===================================================== */

"use strict";



/* =====================================================
   1. OPEN PAGE
===================================================== */

function goPage(page){

    window.location.href = page;

}



/* =====================================================
   2. BACK BUTTON
===================================================== */

function goBack(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }else{

        window.location.href =
        "index.html";

    }

}



/* =====================================================
   3. SAFE LOCAL STORAGE
===================================================== */

function getStorageData(key){

    try{

        let data =
        localStorage.getItem(key);

        if(!data){

            return null;

        }

        return JSON.parse(data);

    }
    catch(error){

        console.log(
            "Storage Error :",
            error
        );

        return null;

    }

}



/* =====================================================
   4. DEFAULT GAME RATES

   These rates show only if admin rate
   data is not available.
===================================================== */

const defaultRates = {

    single:9,

    jodi:90,

    singlePanna:140,

    doublePanna:280,

    triplePanna:600,

    halfSangam:1000,

    fullSangam:10000

};



/* =====================================================
   5. CLEAN NUMBER
===================================================== */

function cleanRate(value, fallback){

    let number =
    Number(value);

    if(
        value === "" ||
        value === null ||
        value === undefined ||
        !Number.isFinite(number)
    ){

        return fallback;

    }

    return number;

}



/* =====================================================
   6. FIND RATE FROM OBJECT

   This supports different admin key names,
   so future editing is easier.
===================================================== */

function findObjectRate(
    object,
    possibleKeys,
    fallback
){

    if(
        !object ||
        typeof object !== "object"
    ){

        return fallback;

    }


    for(
        let i = 0;
        i < possibleKeys.length;
        i++
    ){

        let key =
        possibleKeys[i];


        if(
            object[key] !== undefined &&
            object[key] !== null &&
            object[key] !== ""
        ){

            return cleanRate(
                object[key],
                fallback
            );

        }

    }


    return fallback;

}



/* =====================================================
   7. READ OLD ARRAY FORMAT

   Also supports older code such as:

   [
      {market:"Single",rate:9},
      {market:"Jodi",rate:90}
   ]
===================================================== */

function findArrayRate(
    rates,
    names,
    fallback
){

    if(
        !Array.isArray(rates)
    ){

        return fallback;

    }


    let found =
    rates.find(function(item){

        let name =
        String(
            item.market ||
            item.name ||
            item.game ||
            item.type ||
            ""
        )
        .trim()
        .toLowerCase();


        return names.some(
            function(requiredName){

                return name ===
                requiredName.toLowerCase();

            }
        );

    });


    if(!found){

        return fallback;

    }


    return cleanRate(
        found.rate ||
        found.value ||
        found.amount,
        fallback
    );

}



/* =====================================================
   8. GET FINAL RATE DATA
===================================================== */

function getFinalRates(){

    let savedRates =
    getStorageData("gameRates");


    let finalRates = {

        ...defaultRates

    };


    /* ===============================================
       FORMAT 1
       rates saved as OBJECT
    =============================================== */

    if(
        savedRates &&
        !Array.isArray(savedRates)
    ){

        finalRates.single =
        findObjectRate(
            savedRates,
            [
                "single",
                "singleRate",
                "single_rate"
            ],
            finalRates.single
        );


        finalRates.jodi =
        findObjectRate(
            savedRates,
            [
                "jodi",
                "jodiRate",
                "jodi_rate"
            ],
            finalRates.jodi
        );


        finalRates.singlePanna =
        findObjectRate(
            savedRates,
            [
                "singlePanna",
                "singlePannaRate",
                "single_panna",
                "singlePana",
                "singlePanaRate"
            ],
            finalRates.singlePanna
        );


        finalRates.doublePanna =
        findObjectRate(
            savedRates,
            [
                "doublePanna",
                "doublePannaRate",
                "double_panna",
                "doublePana",
                "doublePanaRate"
            ],
            finalRates.doublePanna
        );


        finalRates.triplePanna =
        findObjectRate(
            savedRates,
            [
                "triplePanna",
                "triplePannaRate",
                "triple_panna",
                "triplePana",
                "triplePanaRate"
            ],
            finalRates.triplePanna
        );


        finalRates.halfSangam =
        findObjectRate(
            savedRates,
            [
                "halfSangam",
                "halfSangamRate",
                "half_sangam"
            ],
            finalRates.halfSangam
        );


        finalRates.fullSangam =
        findObjectRate(
            savedRates,
            [
                "fullSangam",
                "fullSangamRate",
                "full_sangam"
            ],
            finalRates.fullSangam
        );

    }



    /* ===============================================
       FORMAT 2
       OLD ARRAY FORMAT
    =============================================== */

    if(
        Array.isArray(savedRates)
    ){

        finalRates.single =
        findArrayRate(
            savedRates,
            [
                "Single"
            ],
            finalRates.single
        );


        finalRates.jodi =
        findArrayRate(
            savedRates,
            [
                "Jodi"
            ],
            finalRates.jodi
        );


        finalRates.singlePanna =
        findArrayRate(
            savedRates,
            [
                "Single Panna",
                "Single Pana"
            ],
            finalRates.singlePanna
        );


        finalRates.doublePanna =
        findArrayRate(
            savedRates,
            [
                "Double Panna",
                "Double Pana"
            ],
            finalRates.doublePanna
        );


        finalRates.triplePanna =
        findArrayRate(
            savedRates,
            [
                "Triple Panna",
                "Triple Pana"
            ],
            finalRates.triplePanna
        );


        finalRates.halfSangam =
        findArrayRate(
            savedRates,
            [
                "Half Sangam"
            ],
            finalRates.halfSangam
        );


        finalRates.fullSangam =
        findArrayRate(
            savedRates,
            [
                "Full Sangam"
            ],
            finalRates.fullSangam
        );

    }


    return finalRates;

}



/* =====================================================
   9. SHOW RATE IN USER APP
===================================================== */

function showRates(){

    let rates =
    getFinalRates();


    document.getElementById(
        "singleRate"
    ).innerText =
    "1Rs ka " +
    rates.single +
    "Rs";


    document.getElementById(
        "jodiRate"
    ).innerText =
    "1Rs ka " +
    rates.jodi +
    "Rs";


    document.getElementById(
        "singlePannaRate"
    ).innerText =
    "1Rs ka " +
    rates.singlePanna +
    "Rs";


    document.getElementById(
        "doublePannaRate"
    ).innerText =
    "1Rs ka " +
    rates.doublePanna +
    "Rs";


    document.getElementById(
        "triplePannaRate"
    ).innerText =
    "1Rs ka " +
    rates.triplePanna +
    "Rs";


    document.getElementById(
        "halfSangamRate"
    ).innerText =
    "1Rs ka " +
    rates.halfSangam +
    "Rs";


    document.getElementById(
        "fullSangamRate"
    ).innerText =
    "1Rs ka " +
    rates.fullSangam +
    "Rs";

}



/* =====================================================
   10. AUTO UPDATE IF ADMIN CHANGES RATE
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === "gameRates"
        ){

            showRates();

        }

    }
);



/* =====================================================
   11. PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    function(){

        showRates();

        console.log(
            "✅ HR MATKA Game Rate Connected"
        );

    }
);


</script>


</body>

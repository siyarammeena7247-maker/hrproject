

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charts - HR MATKA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{scroll-behavior:smooth;}

body{
    background:#0d0d0d;
    color:#fff;
    min-height:100vh;
    padding-bottom:90px;
}

button,input{font:inherit;}

button{
    -webkit-tap-highlight-color:transparent;
}

.app{
    width:100%;
    max-width:700px;
    margin:auto;
}

/* HEADER */
.header{
    min-height:76px;
    padding:13px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    background:#0d0d0d;
    position:sticky;
    top:0;
    z-index:500;
}

.backBtn{
    width:45px;
    height:45px;
    border:0;
    background:transparent;
    color:#eee;
    font-size:40px;
    cursor:pointer;
}

.title{
    font-size:26px;
    font-weight:700;
}

/* SEARCH */
.searchArea{
    padding:8px 18px 17px;
}

.searchBox{
    width:100%;
    height:60px;
    padding:0 24px;
    border-radius:30px;
    border:1px solid #383838;
    background:#292929;
    color:#fff;
    outline:none;
    font-size:20px;
}

.searchBox:focus{
    border-color:#d9b436;
}

.searchBox::placeholder{
    color:#aaa;
}

/* MARKET LIST */
.marketList{
    padding:0 18px 20px;
}

.marketCard{
    background:#191919;
    border:1px solid #222;
    border-radius:18px;
    padding:19px;
    margin-bottom:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.marketName{
    font-size:21px;
    font-weight:700;
    margin-bottom:17px;
    letter-spacing:.2px;
}

.chartButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.chartBtn{
    height:58px;
    border-radius:13px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:.12s;
}

.chartBtn:active{
    transform:scale(.97);
}

.jodiBtn{
    background:#d9b436;
    border:0;
    color:#fff;
}

.panelBtn{
    background:#0d0d0d;
    border:2px solid #353535;
    color:#fff;
}

.noMarket{
    background:#191919;
    border-radius:16px;
    padding:35px 20px;
    text-align:center;
    color:#aaa;
}

/* SCREENS */
.listScreen.hide{
    display:none;
}

.chartScreen{
    display:none;
    background:#fff;
    color:#182131;
    min-height:100vh;
}

.chartScreen.show{
    display:block;
}

/* CHART HEADER */
.chartHeader{
    min-height:70px;
    background:#1478f2;
    color:#fff;
    padding:11px 12px;
    display:flex;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.chartBackBtn{
    width:42px;
    height:42px;
    min-width:42px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:27px;
    cursor:pointer;
}

.chartHeaderTitle{
    font-size:20px;
    line-height:1.25;
    font-weight:700;
}

/* TABLE */
.chartTableBox{
    width:100%;
    overflow-x:auto;
    overflow-y:visible;
    background:#fff;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:auto;
}

.resultTable{
    width:100%;
    min-width:760px;
    border-collapse:collapse;
    table-layout:fixed;
    background:#fff;
}

.resultTable th{
    height:54px;
    padding:10px 5px;
    background:#1976f3;
    border:1px solid #0c68dc;
    color:#fff;
    text-align:center;
    font-size:16px;
    font-weight:700;
}

.resultTable td{
    height:92px;
    padding:8px 5px;
    background:#fff;
    border:1px solid #e0e3e7;
    color:#182131;
    text-align:center;
    vertical-align:middle;
    font-size:19px;
    font-weight:700;
}

.resultTable th:first-child,
.dateCell{
    width:105px;
    min-width:105px;
}

.dateCell{
    color:#4d5665 !important;
    font-size:13px !important;
    line-height:1.45;
    font-weight:600 !important;
}

.blackResult{
    color:#182131 !important;
}

.redResult{
    color:#d32f2f !important;
}

/* PANEL / PANA */
.panelCell{
    min-width:93px;
    padding:5px 3px !important;
}

.panelValue{
    width:100%;
    min-height:70px;
    display:grid;
    grid-template-columns:24px 34px 24px;
    align-items:center;
    justify-content:center;
    column-gap:3px;
}

.panelDigits{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:1px;
    font-size:14px;
    line-height:1.05;
    font-weight:600;
}

.panelJodi{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:34px;
    font-size:19px;
    font-weight:700;
}

/* EMPTY */
.emptyChart{
    margin:28px 16px;
    padding:35px 20px;
    border:1px solid #ddd;
    border-radius:14px;
    background:#fafafa;
    color:#777;
    text-align:center;
    line-height:1.6;
    font-weight:700;
}

/* SCROLL BUTTONS */
.scrollButtons{
    position:fixed;
    right:16px;
    bottom:20px;
    display:none;
    flex-direction:column;
    gap:9px;
    z-index:3000;
}

.scrollBtn{
    width:54px;
    height:54px;
    border:0;
    border-radius:50%;
    color:#fff;
    font-size:21px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.3);
}

.scrollTopBtn{background:#1976f3;}
.scrollBottomBtn{background:#68727c;}

/* BOTTOM NAV */
.bottomNav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:700px;
    height:80px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    align-items:center;
    background:#111;
    border-top:1px solid #252525;
    z-index:2000;
}

.navItem{
    height:100%;
    border:0;
    background:transparent;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:4px;
    cursor:pointer;
}

.navIcon{
    font-size:21px;
}

.navText{
    font-size:11px;
    font-weight:700;
}

.homeCircle{
    width:56px;
    height:56px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#d9b436;
    border:2px solid #ffd65c;
    font-size:26px;
}

@media(max-width:500px){

    .header{
        min-height:68px;
        padding:10px 12px;
    }

    .title{
        font-size:23px;
    }

    .searchArea{
        padding:6px 14px 14px;
    }

    .marketList{
        padding:0 14px 18px;
    }

    .searchBox{
        height:56px;
        font-size:18px;
    }

    .marketCard{
        padding:17px;
        border-radius:16px;
    }

    .marketName{
        font-size:19px;
    }

    .chartBtn{
        height:55px;
        font-size:17px;
    }

    .chartHeaderTitle{
        font-size:18px;
    }

    .resultTable{
        min-width:750px;
    }

    .resultTable td{
        height:88px;
        font-size:18px;
    }

    .panelValue{
        grid-template-columns:22px 32px 22px;
        column-gap:2px;
    }

    .panelDigits{
        font-size:13px;
    }

    .panelJodi{
        font-size:18px;
    }
}
</style>
</head>

<script>

"use strict";


/* =====================================================
   HR MATKA BACKEND
===================================================== */

const HR_BACKEND =
"http://127.0.0.1:5000";


async function checkChartBackend(){

    try{

        const response =
        await fetch(
            HR_BACKEND + "/api/health"
        );


        if(!response.ok){

            throw new Error(
                "Backend HTTP " +
                response.status
            );

        }


        const data =
        await response.json();


        if(!data.ok){

            throw new Error(
                "Backend Not Ready"
            );

        }


        console.log(
            "✅ Chart Backend Connected"
        );


        return true;

    }
    catch(error){

        console.error(
            "❌ Chart Backend Connection Error:",
            error
        );


        return false;

    }

}




/* =====================================================
   PART 4
   HR MATKA VERIFIED HISTORICAL CHART ENGINE

   PURPOSE:
   1. January 2026 -> Today
   2. Primary + Secondary source verification
   3. Only verified records go into chartHistory
   4. Historical records stay read-only
   5. No duplicate historical import engines
===================================================== */


/* =====================================================
   TODAY -> YYYY-MM-DD
===================================================== */

function chartTodayISO(){

    const now =
    new Date();


    return (
        now.getFullYear()
        +
        "-"
        +
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        )
        +
        "-"
        +
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        )
    );

}


/* =====================================================
   VERIFIED HISTORY UNIQUE KEY

   One Market + One Date = One Record
===================================================== */

function verifiedHistoryKey(record){

    const item =
    normalizeResult(
        record
    );


    return (
        marketNameFormat(
            item.market
        )
        +
        "|"
        +
        canonicalDate(
            item.date
        )
    );

}


/* =====================================================
   CHECK RECORD COMPLETENESS
===================================================== */

function verifiedRecordScore(record){

    const item =
    normalizeResult(
        record
    );


    let score =
    0;


    if(
        item.openPanel
    ){
        score++;
    }


    if(
        item.openSingle
    ){
        score++;
    }


    if(
        item.jodi
    ){
        score++;
    }


    if(
        item.closeSingle
    ){
        score++;
    }


    if(
        item.closePanel
    ){
        score++;
    }


    return score;

}


/* =====================================================
   SHOULD NEW HISTORY REPLACE OLD HISTORY
===================================================== */

function shouldReplaceVerifiedHistory(
    oldRecord,
    newRecord
){

    if(
        !oldRecord
    ){

        return true;

    }


    const oldScore =
    verifiedRecordScore(
        oldRecord
    );


    const newScore =
    verifiedRecordScore(
        newRecord
    );


    if(
        newScore >
        oldScore
    ){

        return true;

    }


    if(
        newScore <
        oldScore
    ){

        return false;

    }


    /*
       Same completeness:
       verified source record ko preference.
    */

    if(
        newRecord &&
        newRecord.verified === true &&
        (
            !oldRecord ||
            oldRecord.verified !== true
        )
    ){

        return true;

    }


    return false;

}


/* =====================================================
   MERGE VERIFIED RECORDS INTO chartHistory

   IMPORTANT:
   Historical metadata preserve hoga.
===================================================== */

function mergeVerifiedChartHistory(
    incoming
){

    if(
        !Array.isArray(
            incoming
        )
    ){

        return{

            imported:0,

            updated:0,

            skipped:0,

            total:
            getChartHistory()
            .length

        };

    }


    let history =
    getChartHistory();


    const map =
    new Map();


    history.forEach(
        function(raw){

            const item =
            normalizeResult(
                raw
            );


            if(
                !item.market ||
                item.date === "-"
            ){

                return;

            }


            map.set(
                verifiedHistoryKey(
                    raw
                ),
                {
                    ...raw
                }
            );

        }
    );


    let imported =
    0;


    let updated =
    0;


    let skipped =
    0;


    incoming.forEach(
        function(raw){

            if(
                !raw ||
                typeof raw !==
                "object"
            ){

                skipped++;

                return;

            }


            const item =
            normalizeResult(
                raw
            );


            if(
                !item.market ||
                item.date === "-" ||
                !item.openPanel
            ){

                skipped++;

                return;

            }


            /*
               Backend historical records must never
               become settlement records.
            */

            const record = {

                ...raw,

                market:
                marketNameFormat(
                    item.market
                ),

                date:
                item.date,

                openPanel:
                item.openPanel,

                openSingle:
                item.openSingle,

                jodi:
                item.jodi,

                closeSingle:
                item.closeSingle,

                closePanel:
                item.closePanel,

                historical:
                true,

                settlementAllowed:
                false,

                verified:
                raw.verified === true,

                importedAt:
                raw.importedAt
                ||
                new Date()
                .toISOString()

            };


            const key =
            verifiedHistoryKey(
                record
            );


            const previous =
            map.get(
                key
            );


            if(
                !previous
            ){

                map.set(
                    key,
                    record
                );


                imported++;

                return;

            }


            const oldItem =
            normalizeResult(
                previous
            );


            const newItem =
            normalizeResult(
                record
            );


            const same =
            oldItem.openPanel ===
            newItem.openPanel
            &&
            oldItem.openSingle ===
            newItem.openSingle
            &&
            oldItem.jodi ===
            newItem.jodi
            &&
            oldItem.closeSingle ===
            newItem.closeSingle
            &&
            oldItem.closePanel ===
            newItem.closePanel;


            if(
                same
            ){

                /*
                   Data same hai to metadata improve kar sakte hain.
                */

                if(
                    record.verified === true &&
                    previous.verified !== true
                ){

                    map.set(
                        key,
                        {
                            ...previous,
                            ...record
                        }
                    );


                    updated++;

                }
                else{

                    skipped++;

                }


                return;

            }


            if(
                shouldReplaceVerifiedHistory(
                    previous,
                    record
                )
            ){

                map.set(
                    key,
                    record
                );


                updated++;

            }
            else{

                skipped++;

            }

        }
    );


    const finalHistory =
    Array.from(
        map.values()
    );


    finalHistory.sort(
        function(a,b){

            const dateA =
            parseResultDate(
                normalizeResult(a).date
            );


            const dateB =
            parseResultDate(
                normalizeResult(b).date
            );


            return (
                (
                    dateA
                    ?
                    dateA.getTime()
                    :
                    0
                )
                -
                (
                    dateB
                    ?
                    dateB.getTime()
                    :
                    0
                )
            );

        }
    );


    saveStorage(
        "chartHistory",
        finalHistory
    );


    return{

        imported:
        imported,

        updated:
        updated,

        skipped:
        skipped,

        total:
        finalHistory.length

    };

}


/* =====================================================
   VERIFIED SOURCE CONFIG

   IMPORTANT:
   URL guess nahi karenge.

   Admin result.html me jis market ko verify kiya gaya,
   uska source pair chart page automatically remember karega.
===================================================== */

function getVerifiedChartSources(){

    let sources =
    getStorage(
        "verifiedHistoricalChartSources",
        []
    );


    if(
        !Array.isArray(
            sources
        )
    ){

        sources =
        [];

    }


    return sources;

}


/* =====================================================
   SAVE / UPDATE ONE MARKET SOURCE PAIR
===================================================== */

function saveVerifiedChartSource(
    config
){

    if(
        !config
    ){

        return null;

    }


    const market =
    marketNameFormat(
        config.market
    );


    const primaryUrl =
    String(
        config.primaryUrl || ""
    ).trim();


    const secondaryUrl =
    String(
        config.secondaryUrl || ""
    ).trim();


    if(
        !market ||
        !primaryUrl ||
        !secondaryUrl
    ){

        return null;

    }


    const sources =
    getVerifiedChartSources();


    let item =
    sources.find(
        function(source){

            return (
                marketNameFormat(
                    source.market
                )
                ===
                market
            );

        }
    );


    if(
        !item
    ){

        item = {

            market:
            market

        };


        sources.push(
            item
        );

    }


    item.market =
    market;


    item.primaryUrl =
    primaryUrl;


    item.primarySource =
    String(
        config.primarySource ||
        "DPBOSS"
    ).trim();


    item.secondaryUrl =
    secondaryUrl;


    item.secondarySource =
    String(
        config.secondarySource ||
        "SATTA MATKA DPBOSS"
    ).trim();


    item.active =
    config.active !==
    false;


    item.updatedAt =
    new Date()
    .toISOString();


    saveStorage(
        "verifiedHistoricalChartSources",
        sources
    );


    return item;

}


/* =====================================================
   READ LAST SOURCE PAIR SAVED BY result.html PART 3
===================================================== */

function syncVerifiedSourceFromAdmin(){

    const status =
    getStorage(
        "historicalVerifyStatus",
        null
    );


    if(
        !status ||
        typeof status !==
        "object"
    ){

        return null;

    }


    if(
        !status.market ||
        !status.primaryUrl ||
        !status.secondaryUrl
    ){

        return null;

    }


    return saveVerifiedChartSource(
        {

            market:
            status.market,

            primaryUrl:
            status.primaryUrl,

            primarySource:
            status.primarySource
            ||
            "DPBOSS",

            secondaryUrl:
            status.secondaryUrl,

            secondarySource:
            status.secondarySource
            ||
            "SATTA MATKA DPBOSS",

            active:
            true

        }
    );

}


/* =====================================================
   IMPORT ONE VERIFIED MARKET
===================================================== */

async function importVerifiedHistoricalMarket(
    config
){

    if(
        !config ||
        config.active === false
    ){

        return{

            ok:false,

            skipped:true,

            reason:
            "INACTIVE"

        };

    }


    const market =
    marketNameFormat(
        config.market
    );


    const primaryUrl =
    String(
        config.primaryUrl || ""
    ).trim();


    const secondaryUrl =
    String(
        config.secondaryUrl || ""
    ).trim();


    if(
        !market ||
        !primaryUrl ||
        !secondaryUrl
    ){

        return{

            ok:false,

            skipped:true,

            market:
            market,

            reason:
            "SOURCE_URL_MISSING"

        };

    }


    try{

        console.log(
            "⏳ Verified Chart Import:",
            market
        );


        const response =
        await fetch(
            HR_BACKEND
            +
            "/api/history/verify",
            {

                method:
                "POST",

                headers:{

                    "Content-Type":
                    "application/json"

                },

                body:
                JSON.stringify(
                    {

                        market:
                        market,

                        from:
                        "2026-01-01",

                        to:
                        chartTodayISO(),


                        primary:{

                            url:
                            primaryUrl,

                            source:
                            config.primarySource
                            ||
                            "DPBOSS"

                        },


                        secondary:{

                            url:
                            secondaryUrl,

                            source:
                            config.secondarySource
                            ||
                            "SATTA MATKA DPBOSS"

                        }

                    }
                )

            }
        );


        const data =
        await response.json();


        if(
            !response.ok ||
            !data.ok
        ){

            throw new Error(
                data.message
                ||
                (
                    "HTTP "
                    +
                    response.status
                )
            );

        }


        const records =
        Array.isArray(
            data.records
        )
        ?
        data.records
        :
        [];


        if(
            Number(
                data.primaryTotal || 0
            )
            ===
            0
        ){

            throw new Error(
                "Primary history zero records"
            );

        }


        if(
            Number(
                data.secondaryTotal || 0
            )
            ===
            0
        ){

            throw new Error(
                "Secondary history zero records"
            );

        }


        if(
            records.length ===
            0
        ){

            throw new Error(
                "Verified history zero records"
            );

        }


        const saved =
        mergeVerifiedChartHistory(
            records
        );


        console.log(
            "✅ Verified Chart Imported:",
            market,

/* DATE */
function extractDateOnly(value){

    if(!value){
        return "-";
    }

    let text = String(value).trim();

    if(text.includes(",")){
        text = text.split(",")[0].trim();
    }

    return text || "-";
}


function parseResultDate(value){

    if(!value || value === "-"){
        return null;
    }

    const text = String(value).trim();

    let match = text.match(
        /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/
    );

    if(match){

        const date = new Date(
            Number(match[3]),
            Number(match[2]) - 1,
            Number(match[1])
        );

        date.setHours(0,0,0,0);

        return date;
    }

    match = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
    );

    if(match){

        const date = new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );

        date.setHours(0,0,0,0);

        return date;
    }

    const parsed = new Date(text);

    if(isNaN(parsed.getTime())){
        return null;
    }

    parsed.setHours(0,0,0,0);

    return parsed;
}


function formatShortDate(date){

    if(!date){
        return "-";
    }

    const dd = String(
        date.getDate()
    ).padStart(2,"0");

    const mm = String(
        date.getMonth() + 1
    ).padStart(2,"0");

    const yy = String(
        date.getFullYear()
    ).slice(-2);

    return `${dd}/${mm}/${yy}`;
}


function makeDateKey(date){

    if(!date){
        return "";
    }

    return (
        date.getFullYear() +
        "-" +
        String(date.getMonth()+1).padStart(2,"0") +
        "-" +
        String(date.getDate()).padStart(2,"0")
    );
}


function canonicalDate(value){

    const date = parseResultDate(value);

    if(!date){
        return extractDateOnly(value);
    }

    return makeDateKey(date);
}

function getTimestamp(item){

    if(!item){
        return 0;
    }

    const candidates = [
        item.timestamp,
        item.updatedAt,
        item.createdAt,
        item.id
    ];

    for(const value of candidates){

        if(
            value === undefined ||
            value === null ||
            value === ""
        ){
            continue;
        }

        if(typeof value === "number"){

            if(Number.isFinite(value)){
                return value;
            }
        }

        const numeric = Number(value);

        if(
            Number.isFinite(numeric) &&
            numeric > 0
        ){
            return numeric;
        }

        const date = new Date(value);

        if(!isNaN(date.getTime())){
            return date.getTime();
        }
    }

    return 0;
}

function normalizeResult(item){

    item = item || {};

    let openPanel = cleanValue(
        firstValue(

        )
    );

    let jodi = cleanValue(
        firstValue(

        )
    );

    if(
        !jodi &&
        openSingle !== "" &&
        closeSingle !== ""
    ){
        jodi =
            String(openSingle) +
            String(closeSingle);
    }

    return {

        id:firstValue(
            item.id,
            ""
        ),

        market:marketNameFormat(
            firstValue(
                item.market,

            )

        date:extractDateOnly(
            firstValue(

                item.date
            )
        ),

        time:cleanValue(
            firstValue(

                item.time
            )
        ),

        status:cleanValue(

        ),

        timestamp:getTimestamp(item)
    };
}


/* COMPLETENESS SCORE */
function recordScore(item){

    let score = 0;

    if(item.openPanel) score++;
    if(item.openSingle) score++;
    if(item.jodi) score++;
    if(item.closeSingle) score++;
    if(item.closePanel) score++;

    return score;
}


function shouldReplaceRecord(oldItem, newItem){

    if(!oldItem){
        return true;
    }

    const oldScore = recordScore(oldItem);
    const newScore = recordScore(newItem);

    /*
       More complete record always wins.
       Isse completed chart ko baad me
       incomplete/open-only result overwrite
       nahi karega.
    */
    if(newScore > oldScore){
        return true;
    }

    if(newScore < oldScore){
        return false;
    }

    return (
        Number(newItem.timestamp || 0) >=
        Number(oldItem.timestamp || 0)
    );
}

/* PERMANENT HISTORY */
function syncResultsToChartHistory(){

    const results =
    getAdminResults();


    const history =
    getChartHistory();


    const map =
    new Map();


    /* =================================================
       EXISTING CHART HISTORY

       Raw record preserve karna important hai,
       taki historical/verified metadata lost na ho.
    ================================================= */

    history.forEach(
        function(raw){

            const item =
            normalizeResult(
                raw
            );


            if(
                !item.market ||
                item.date === "-"
            ){

                return;

            }


            const key =
            item.market
            +
            "|"
            +
            canonicalDate(
                item.date
            );


            const previousRaw =
            map.get(
                key
            );


            if(
                !previousRaw
            ){

                map.set(
                    key,
                    {
                        ...raw
                    }
                );


                return;

            }


            const previous =
            normalizeResult(
                previousRaw
            );


            if(
                shouldReplaceRecord(
                    previous,
                    item
                )
            ){

                map.set(
                    key,
                    {
                        ...raw
                    }
                );

            }

        }
    );


    /* =================================================
       CURRENT ADMIN RESULTS

       Current result can improve same market/date record,
       but raw history metadata unnecessarily destroy nahi hoga.
    ================================================= */

    results.forEach(
        function(raw){

            const item =
            normalizeResult(
                raw
            );


            if(
                !item.market ||
                item.date === "-"
            ){

                return;

            }


            const key =
            item.market
            +
            "|"
            +
            canonicalDate(
                item.date
            );


            const previousRaw =
            map.get(
                key
            );


            if(
                !previousRaw
            ){

                map.set(
                    key,
                    {
                        ...raw,

                        market:
                        item.market,

                        date:
                        item.date
                    }
                );


                return;

            }


            const previous =
            normalizeResult(
                previousRaw
            );


            if(
                shouldReplaceRecord(
                    previous,
                    item
                )
            ){

                map.set(
                    key,
                    {

                        ...previousRaw,

                        ...raw,

                        market:
                        item.market,

                        date:
                        item.date,

                        /*
                           Agar previous record historical tha,
                           live/admin result uski historical
                           safety flag ko true settlement record
                           me convert nahi karega.
                        */

                        historical:
                        raw.historical === true,

                        settlementAllowed:
                        raw.historical === true
                        ?
                        false
                        :
                        raw.settlementAllowed

                    }
                );

            }

        }
    );


    const finalHistory =
    Array.from(
        map.values()
    );


    finalHistory.sort(
        function(a,b){

            const itemA =
            normalizeResult(
                a
            );


            const itemB =
            normalizeResult(
                b
            );


            const dateA =
            parseResultDate(
                itemA.date
            );


            const dateB =
            parseResultDate(
                itemB.date
            );


            return (
                (
                    dateA
                    ?
                    dateA.getTime()
                    :
                    0
                )
                -
                (
                    dateB
                    ?
                    dateB.getTime()
                    :
                    0
                )
            );

        }
    );


    saveStorage(
        "chartHistory",
        finalHistory
    );

}

/* WEEK ROWS */
function buildWeekRows(records){

    const datedRecords = [];

    records.forEach(function(item){

        const parsedDate =
            parseResultDate(
                item.date
            );

        if(parsedDate){

            datedRecords.push({
                ...item,
                parsedDate:parsedDate
            });
        }
    });


    if(datedRecords.length === 0){
        return [];
    }


    datedRecords.sort(
        function(a,b){

            return (
                a.parsedDate -
                b.parsedDate
            );
        }
    );


    const dateMap =
        new Map();


    datedRecords.forEach(
        function(item){

            const key =
                makeDateKey(
                    item.parsedDate
                );

            const old =
                dateMap.get(key);

            if(
                shouldReplaceRecord(
                    old,
                    item
                )
            ){
                dateMap.set(
                    key,
                    item
                );
            }
        }
    );


    const first =
        new Date(
            datedRecords[0]
            .parsedDate
        );

    const firstDay =
        first.getDay();

    const difference =
        firstDay === 0
        ? -6
        : 1 - firstDay;

    first.setDate(
        first.getDate() +
        difference
    );

    first.setHours(0,0,0,0);


    const last =
        new Date(
            datedRecords[
                datedRecords.length - 1
            ].parsedDate
        );

    const lastDay =
        last.getDay();

    const addDays =
        lastDay === 0
        ? 0
        : 7 - lastDay;

    last.setDate(
        last.getDate() +
        addDays
    );

    last.setHours(0,0,0,0);


    const rows = [];

    const cursor =
        new Date(first);


    while(cursor <= last){

        const weekStart =
            new Date(cursor);

        const weekEnd =
            new Date(weekStart);

        weekEnd.setDate(
            weekEnd.getDate() + 6
        );

        const days = [];

        for(let i=0; i<7; i++){

            const day =
                new Date(
                    weekStart
                );

            day.setDate(
                day.getDate() + i
            );

            days.push(
                dateMap.get(
                    makeDateKey(day)
                ) || null
            );
        }

        rows.push({
            start:weekStart,
            end:weekEnd,
            days:days
        });

        cursor.setDate(
            cursor.getDate() + 7
        );
    }

    return rows;
}


/* JODI */
function isRedJodi(value){

    const text =
        String(value || "")
        .replace(/\D/g,"");

    return (
        text.length === 2 &&
        text[0] === text[1]
    );
}


function getDisplayJodi(record){

    if(!record){
        return "-";
    }

    const openSingle =
        cleanValue(
            record.openSingle
        );

    const closeSingle =
        cleanValue(
            record.closeSingle
        );

    const closePanel =
        cleanValue(
            record.closePanel
        );

    let jodi =
        cleanValue(
            record.jodi
        );


    /*
       Open result aa gaya lekin
       Close result pending hai.
    */
    if(
        !closeSingle ||
        !closePanel
    ){
        return "**";
    }


    if(
        !jodi &&
        openSingle &&
        closeSingle
    ){
        jodi =
            openSingle +
            closeSingle;
    }


    if(!jodi){
        return "**";
    }


    const digits =
        jodi.replace(
            /\D/g,
            ""
        );


    if(digits.length === 1){
        return "0" + digits;
    }

    if(digits.length >= 2){
        return digits.slice(-2);
    }

    return jodi;
}

                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
                <th>Sun</th>
            </tr>
        </thead>

        <tbody>
    `;


    rows.forEach(function(row){

        html += `
        <tr>

            <td class="dateCell">
                ${formatShortDate(row.start)}
                <br>
                to
                <br>
                ${formatShortDate(row.end)}
            </td>
        `;


        row.days.forEach(
            function(record){

                const value =
                    getDisplayJodi(
                        record
                    );

                const css =
                    isRedJodi(value)
                    ? "redResult"
                    : "blackResult";

                html += `
                <td class="${css}">
                    ${safe(value)}
                </td>
                `;
            }
        );


        html += `</tr>`;
    });


    html += `
        </tbody>
    </table>
    `;


    document.getElementById(
        "chartContent"
    ).innerHTML = html;
}


/* PANEL */
function panelDigits(value){

    const text =
        String(value || "")
        .replace(/\D/g,"");

    if(text.length !== 3){
        return ["-","-","-"];
    }

    return text.split("");
}


function makePanelHTML(record){

    if(!record){
        return "-";
    }

    const openDigits =
        panelDigits(
            record.openPanel
        );

    const closeDigits =
        panelDigits(
            record.closePanel
        );

    const jodi =
        getDisplayJodi(
            record
        );

    const css =
        isRedJodi(jodi)
        ? "redResult"
        : "blackResult";


    return `
    <div class="panelValue ${css}">

        <div class="panelDigits">
            <span>${openDigits[0]}</span>
            <span>${openDigits[1]}</span>
            <span>${openDigits[2]}</span>
        </div>

        <div class="panelJodi">
            ${safe(jodi)}
        </div>

        <div class="panelDigits">
            <span>${closeDigits[0]}</span>
            <span>${closeDigits[1]}</span>
            <span>${closeDigits[2]}</span>
        </div>

    </div>
    `;
}


/* PANEL CHART */
function renderPanelChart(
    market,
    records
){

    const rows =
        buildWeekRows(records);

    if(rows.length === 0){

        showEmptyChart();
        return;
    }


    let html = `
    <table class="resultTable">

        <thead>
            <tr>
                <th>Date</th>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
                <th>Sun</th>
            </tr>
        </thead>

        <tbody>
    `;


    rows.forEach(function(row){

        html += `
        <tr>

            <td class="dateCell">
                ${formatShortDate(row.start)}
                <br>
                to
                <br>
                ${formatShortDate(row.end)}
            </td>
        `;


        row.days.forEach(
            function(record){

                html += `
                <td class="panelCell">
                    ${makePanelHTML(record)}
                </td>
                `;
            }
        );


        html += `</tr>`;
    });


    html += `
        </tbody>
    </table>
    `;


    document.getElementById(
        "chartContent"
    ).innerHTML = html;
}


/* EMPTY CHART */
function showEmptyChart(){

    document.getElementById(
        "chartContent"
    ).innerHTML = `
        <div class="emptyChart">

            Result Chart Data Not Available Yet

            <br><br>

            Admin se result declare hone ke baad
            is market ka Jodi aur Pana chart
            automatically yahan dikhai dega.

        </div>
    `;
}


/* ACTIVE CHART */
let activeMarket = "";
let activeChartType = "";


/* OPEN */
function openChart(
    market,
    type
){

    activeMarket =
        market;

    activeChartType =
        type;

    const records =
        getMarketResults(
            market
        );

    const chartName =
        type === "panel"
        ? "Pana"
        : "Jodi";


    document.getElementById(
        "chartTitle"
    ).innerText =
        market +
        " Result " +
        chartName +
        " Chart";


    document.getElementById(
        "listScreen"
    ).classList.add(
        "hide"
    );


    document.getElementById(
        "chartScreen"
    ).classList.add(
        "show"
    );


    document.getElementById(
        "bottomNav"
    ).style.display =
        "none";


    document.getElementById(
        "scrollButtons"
    ).style.display =
        "flex";


    document.body.style.paddingBottom =
        "0";


    window.scrollTo(
        0,
        0
    );


    if(type === "panel"){

        renderPanelChart(
            market,
            records
        );

    }else{

        renderJodiChart(
            market,
            records
        );
    }


    requestAnimationFrame(
        function(){

            const box =
                document.getElementById(
                    "chartContent"
                );

            box.scrollLeft = 0;
        }
    );
}


/* REFRESH */
function refreshOpenChart(){

    if(
        !activeMarket ||
        !activeChartType
    ){
        return;
    }


    const box =
        document.getElementById(
            "chartContent"
        );

    const oldHorizontalScroll =
        box.scrollLeft;


    const records =
        getMarketResults(
            activeMarket
        );


    if(
        activeChartType ===
        "panel"
    ){

        renderPanelChart(
            activeMarket,
            records
        );

    }else{

        renderJodiChart(
            activeMarket,
            records
        );
    }


    requestAnimationFrame(
        function(){

            box.scrollLeft =
                oldHorizontalScroll;
        }
    );
}


/* CLOSE */
function closeChart(){

    activeMarket = "";
    activeChartType = "";


    document.getElementById(
        "chartScreen"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "listScreen"
    ).classList.remove(
        "hide"
    );


    document.getElementById(
        "bottomNav"
    ).style.display =
        "grid";


    document.getElementById(
        "scrollButtons"
    ).style.display =
        "none";


    document.body.style.paddingBottom =
        "90px";


    window.scrollTo(
        0,
        0
    );
}


/* SCROLL */
function scrollChartTop(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function scrollChartBottom(){

    window.scrollTo({
        top:
        document.documentElement
        .scrollHeight,

        behavior:"smooth"
    });
}

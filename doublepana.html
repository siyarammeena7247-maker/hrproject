


<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Double Pana</title>

<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
}

.topBar{
height:70px;
background:#1c1c1c;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
}

.backBtn{
font-size:34px;
font-weight:bold;
cursor:pointer;
}

.marketTitle{
font-size:22px;
font-weight:bold;
text-align:center;
}

.walletBox{
background:#2b2b2b;
padding:10px 18px;
border-radius:25px;
font-size:20px;
font-weight:bold;
color:#d9b13d;
}

.dateSection{
display:flex;
justify-content:space-between;
gap:15px;
padding:15px;
}

.dateBox{
flex:1;
height:55px;
border:2px solid #d9b13d;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:bold;
background:#151515;
color:#fff;
}

.sessionBox{
flex:1;
display:flex;
gap:10px;
}

.sessionBox button{
flex:1;
height:55px;
border:none;
border-radius:12px;
font-size:20px;
font-weight:bold;
cursor:pointer;
background:#2b2b2b;
color:#aaa;
transition:.3s;
}

.sessionActive{
background:#4CAF50 !important;
color:#fff !important;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
color:#000;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

h1{
text-align:center;
color:#e53935;
margin-bottom:10px;
}

h2{
text-align:center;
margin-bottom:20px;
}

.wallet{
background:#4CAF50;
color:#fff;
padding:15px;
border-radius:10px;
text-align:center;
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:20px;
}

.grid button{
padding:14px;
border:none;
border-radius:8px;
background:#2196F3;
color:#fff;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.grid button:hover{
background:#1976D2;
}

.grid button.selected{
background:#4CAF50;
}

input{
width:100%;
padding:14px;
margin-top:20px;
font-size:18px;
border:1px solid #ccc;
border-radius:8px;
outline:none;
}

input:focus{
border-color:#2196F3;
}

#submitBtn{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:10px;
background:#e53935;
color:#fff;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

#submitBtn:hover{
background:#c62828;
}

a{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
font-weight:bold;
color:#2196F3;
}

@media(max-width:768px){

.marketTitle{
font-size:18px;
}

.walletBox{
font-size:16px;
padding:8px 14px;
}

.dateSection{
flex-direction:column;
}

.grid{
grid-template-columns:repeat(4,1fr);
}

.grid button{
font-size:15px;
padding:12px;
}

.sessionBox button{
font-size:17px;
}

#submitBtn{
font-size:18px;
}

}



.panaTable{

margin-top:20px;

}

.panaRow{

display:flex;

align-items:center;

gap:12px;

margin-bottom:10px;

}

.panaNumber{

width:90px;

height:42px;

background:#2196F3;

color:#fff;

border-radius:8px;

display:flex;

align-items:center;

justify-content:center;

font-weight:bold;

font-size:18px;

}

.panaPoint{

flex:1;

padding:12px;

font-size:17px;

border-radius:8px;

border:1px solid #ccc;

}



</style>

</head>

<body>

<!-- ========================= -->
<!-- TOP HEADER -->
<!-- ========================= -->

<div class="topBar">

<div class="backBtn"
onclick="history.back()">

←

</div>

<div
class="marketTitle"
id="marketTitle">

Loading...

</div>

<div class="walletBox">

🪙 ₹
<span id="topWallet">

0

</span>

</div>

</div>

<!-- ========================= -->
<!-- DATE + SESSION -->
<!-- ========================= -->

<div class="dateSection">

<div
class="dateBox"
id="todayDate">

00-00-0000

</div>

<div
class="sessionBox">

<button
id="openBtn"
class="sessionActive">

OPEN

</button>

<button
id="closeBtn">

CLOSE

</button>

</div>

</div>

<!-- ========================= -->
<!-- MAIN CARD -->
<!-- ========================= -->

<div class="container">

<div class="card">

<h1 id="appTitle">

HR MATKA

</h1>

<div class="wallet">

Wallet Balance

<br><br>

₹
<span id="wallet">

0

</span>

</div>

<h2>

Double Pana

</h2>

<!-- DOUBLE PANA GRID -->



<div class="panaTable" id="doublePanaGrid">

</div>

<h3>

Total Points :

<span id="totalPoints">

0

</span>

</h3>


<!-- SUBMIT -->

<button
id="submitBtn">

Submit Bid

</button>

<a href="marketgame.html">

⬅ Back

</a>

</div>

</div>



<script>



// ======================================
// DOUBLE PANA FINAL
// PART - 3
// ======================================

// Current User
let currentUser =
JSON.parse(localStorage.getItem("currentUser")) || {};

let balances =
JSON.parse(localStorage.getItem("userBalances")) || {};

let markets =
JSON.parse(localStorage.getItem("markets")) || [];

// Current Market
let currentMarket = null;

// Selected Pana
let selectedPana = "";

// Selected Session
let selectedSession = "OPEN";

// ======================================
// DOUBLE PANA LIST
// ======================================

const doublePanaList = [

"100","110","166","200","228","255","277","300","336","355",
"399","400","444","499","500","550","588","660","688","778",
"779","788","800","880","889","900","990",

"119","155","227","335","344","669","777",

"128","137","146","236","245","290","380","470","489","560","678",

"129","138","147","156","237","246","345","390","480","570","679",

"120","139","148","157","238","247","256","346","490","580","670",

"130","149","158","167","239","248","257","347","356","590","680",

"140","159","168","230","249","258","267","348","357","456","690",

"150","169","178","240","259","268","349","358","367","457","790",

"160","179","250","269","278","359","368","458","467","890",

"170","189","260","279","369","378","459","468","567",

"180","289","370","379","469","478","568","667"

];

// ======================================
// LOAD WALLET
// ======================================

function loadWallet(){

if(!currentUser.mobile){

alert("Login Required");

window.location.href="login.html";

return;

}

let wallet =
Number(balances[currentUser.mobile] || 0);

document.getElementById("wallet").innerHTML = wallet;
document.getElementById("topWallet").innerHTML = wallet;

}

// ======================================
// LOAD MARKET
// ======================================

function loadMarket(){

if(markets.length==0){

document.getElementById("marketTitle").innerHTML =
"No Market";

return;

}

currentMarket = markets[0];

document.getElementById("marketTitle").innerHTML =
currentMarket.marketName + " [Double Pana]";

}

// ======================================
// LOAD DATE
// ======================================

function loadTodayDate(){

let today = new Date();

let dd =
String(today.getDate()).padStart(2,"0");

let mm =
String(today.getMonth()+1).padStart(2,"0");

let yyyy =
today.getFullYear();

document.getElementById("todayDate").innerHTML =
dd + "-" + mm + "-" + yyyy;

}

// ======================================
// SESSION BUTTONS
// ======================================

document.getElementById("openBtn").onclick=function(){

selectedSession="OPEN";

this.classList.add("sessionActive");

document.getElementById("closeBtn")
.classList.remove("sessionActive");

};

document.getElementById("closeBtn").onclick=function(){

selectedSession="CLOSE";

this.classList.add("sessionActive");

document.getElementById("openBtn")
.classList.remove("sessionActive");

};

// ======================================
// LOAD DOUBLE PANA
// ======================================

function loadDoublePana(){

let grid =
document.getElementById("doublePanaGrid");

grid.innerHTML="";

doublePanaList.forEach(function(number){

grid.innerHTML += `

<button
class="panaBtn"
onclick="selectPana('${number}')">

${number}

</button>

`;

});

}

// ======================================
// SELECT PANA
// ======================================

function selectPana(number){

selectedPana = number;

document
.querySelectorAll(".panaBtn")
.forEach(function(btn){

btn.classList.remove("selected");

if(btn.innerHTML==number){

btn.classList.add("selected");

}

});

}

// ======================================
// START
// ======================================

loadWallet();

loadMarket();

loadTodayDate();

loadDoublePana();


// ======================================
// DOUBLE PANA FINAL
// PART - 4
// SUBMIT BID
// ======================================

document
.getElementById("submitBtn")
.addEventListener("click", submitBid);

function submitBid(){

if(selectedPana==""){

alert("Please Select Double Pana");

return;

}

let amount =
Number(document.getElementById("amount").value);

if(amount<=0){

alert("Please Enter Valid Points");

return;

}

let wallet =
Number(balances[currentUser.mobile] || 0);

if(amount>wallet){

alert("Insufficient Wallet Balance");

return;

}

let previousBalance = wallet;

// Wallet Deduct
wallet = wallet - amount;

balances[currentUser.mobile] = wallet;

localStorage.setItem(
"userBalances",
JSON.stringify(balances)
);

document.getElementById("wallet").innerHTML = wallet;
document.getElementById("topWallet").innerHTML = wallet;

// Date & Time
let now = new Date();

let date =
now.toLocaleDateString("en-GB");

let time =
now.toLocaleTimeString("en-US",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
});

// ======================================
// BET SAVE
// ======================================

let bets =
JSON.parse(localStorage.getItem("bets")) || [];

bets.push({

id:Date.now(),

mobile:currentUser.mobile,

name:currentUser.name,

market:currentMarket.marketName,

session:selectedSession,

game:"Double Pana",

number:selectedPana,

amount:amount,

date:date,

time:time,

status:"Pending"

});

localStorage.setItem(
"bets",
JSON.stringify(bets)
);

// ======================================
// TODAY PLAY
// ======================================

let todayPlay =
JSON.parse(localStorage.getItem("todayPlay")) || [];

todayPlay.push({

mobile:currentUser.mobile,

market:currentMarket.marketName,

session:selectedSession,

game:"Double Pana",

amount:amount,

date:date

});

localStorage.setItem(
"todayPlay",
JSON.stringify(todayPlay)
);

// ======================================
// PASSBOOK
// ======================================

let passbook =
JSON.parse(localStorage.getItem("passbook")) || [];

passbook.push({

mobile:currentUser.mobile,

date:date,

time:time,

type:"Game Play",

previousBalance:previousBalance,

amount:amount,

currentBalance:wallet,

status:"Success",

details:
currentMarket.marketName +
" (" + selectedSession + ")" +
" - Double Pana"

});

localStorage.setItem(
"passbook",
JSON.stringify(passbook)
);

// Clear Form

selectedPana="";

document
.querySelectorAll(".panaBtn")
.forEach(function(btn){

btn.classList.remove("selected");

});

document.getElementById("amount").value="";

alert("Double Pana Bid Submitted Successfully");

}



// ======================================
// DOUBLE PANA FINAL
// PART - 5
// FINAL VALIDATION + ADMIN/USER SYNC
// ======================================

// Minimum Bid
const MIN_POINTS = 10;

// ======================================
// MARKET STATUS
// ======================================

function isMarketOpen(){

if(!currentMarket){
return false;
}

// आगे Market Time Setting बनने पर
// Open/Close Time यहीं Check होगा

return true;

}

// ======================================
// FINAL VALIDATION
// ======================================

function finalValidation(){

let amount =
Number(document.getElementById("amount").value);

if(amount < MIN_POINTS){

alert(
"Minimum Bid " +
MIN_POINTS +
" Points Required"
);

return false;

}

if(selectedPana==""){

alert("Please Select Double Pana");

return false;

}

if(!isMarketOpen()){

alert("Market Closed");

return false;

}

return true;

}

// ======================================
// FINAL BUTTON
// ======================================

document
.getElementById("submitBtn")
.onclick = function(){

if(finalValidation()){

submitBid();

}

};

// ======================================
// AUTO WALLET REFRESH
// ======================================

setInterval(function(){

let balances =
JSON.parse(localStorage.getItem("userBalances")) || {};

let wallet =
Number(
balances[currentUser.mobile] || 0
);

document.getElementById("wallet").innerHTML =
wallet;

document.getElementById("topWallet").innerHTML =
wallet;

},3000);

// ======================================
// FINAL PROJECT CONNECTION
// ======================================

// ✅ userBalances
// ✅ bets
// ✅ todayPlay
// ✅ passbook
// ✅ history.html
// ✅ admin todaytotalplay.html
// ✅ admin passbook
// ✅ users management
// ✅ OPEN / CLOSE Session Save
// ✅ Future Result System Ready

console.log(
"Double Pana Final Connected Successfully"
);


</script>

</body>

</html>

/* =====================================================
   STORAGE
===================================================== */

function getStorage(
    key,
    fallback
){

    try{

        let raw =
        localStorage.getItem(
            key
        );


        if(
            raw === null ||
            raw === undefined ||
            raw === ""
        ){

            return fallback;

        }


        return JSON.parse(
            raw
        );

    }
    catch(error){

        console.error(
            "Storage Read Error:",
            key,
            error
        );


        return fallback;

    }

}



/* =====================================================
   CURRENT USER
===================================================== */

let currentUser =
getStorage(

);


if(

){

/* =====================================================
   NAVIGATION
===================================================== */

function goPage(page){

    window.location.href =

function goBack(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }

    else{

    }

}



/* =====================================================
   SAFE
===================================================== */

function safe(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "-";

    }


    return String(
        value
    );

}


function escapeHTML(value){

    return String(
        value === undefined ||
        value === null
        ? ""
        : value
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



/* =====================================================
   MOBILE NORMALIZE
===================================================== */

function normalizeMobile(value){

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    );

}



/* =====================================================
   ADMIN SETTINGS
===================================================== */

    );

   WALLET

/* =====================================================
   DATE HELPERS
===================================================== */

function getTodayISO(){

    let d =
    new Date();


    return (

        d.getFullYear()

        +

        "-"

        +

        String(
            d.getMonth()+1
        )
        .padStart(
            2,
            "0"
        )

        +

        "-"

        +

        String(
            d.getDate()
        )
        .padStart(
            2,
            "0"
        )

    );

}


function normalizeDate(value){

    if(!value){

        return "";

    }


    let text =
    String(
        value
    )
    .trim();


    let slash =
    text.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})/
    );


    if(slash){

        return (

            slash[3]

            +

            "-"

            +

            String(
                slash[2]
            )
            .padStart(
                2,
                "0"
            )

            +

            "-"

            +

            String(
                slash[1]
            )
            .padStart(
                2,
                "0"
            )

        );

    }


    let dash =
    text.match(
        /^(\d{1,2})-(\d{1,2})-(\d{4})/
    );


    if(dash){

        return (

            dash[3]

            +

            "-"

            +

            String(
                dash[2]
            )
            .padStart(
                2,
                "0"
            )

            +

            "-"

            +

            String(
                dash[1]
            )
            .padStart(
                2,
                "0"
            )

        );

    }


    if(
        /^\d{4}-\d{2}-\d{2}/
        .test(
            text
        )
    ){

        return text.substring(
            0,
            10
        );

    }


    let parsed =
    new Date(
        text
    );


    if(
        isNaN(
            parsed.getTime()
        )
    ){

        return "";

    }


    return (

        parsed.getFullYear()

        +

        "-"

        +

        String(
            parsed.getMonth()+1
        )
        .padStart(
            2,
            "0"
        )

        +

        "-"

        +

        String(
            parsed.getDate()
        )
        .padStart(
            2,
            "0"
        )

    );

}


function displayDate(value){

    let normalized =
    normalizeDate(
        value
    );


    if(!normalized){

        return safe(
            value
        );

    }


    let parts =
    normalized.split(
        "-"
    );


    return (

        parts[2]

        +

        "/"

        +

        parts[1]

        +

        "/"

        +

        parts[0]

    );

}



/* =====================================================
   TIME FORMAT
   CAPITAL AM / PM
===================================================== */

function formatTime12(value){

    if(
        !value ||
        value === "-"
    ){

        return "-";

    }


    let text =
    String(
        value
    )
    .trim();


    if(
        /\b(am|pm)\b/i
        .test(
            text
        )
    ){

        return text
        .replace(
            /\bam\b/gi,
            "AM"
        )
        .replace(
            /\bpm\b/gi,
            "PM"
        );

    }


    let match =
    text.match(
        /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );


    if(match){

        let hour =
        Number(
            match[1]
        );


        if(
            hour >= 0 &&
            hour <= 23
        ){

            let suffix =
            hour >= 12
            ? "PM"
            : "AM";


            let hour12 =
            hour % 12;


            if(
                hour12 === 0
            ){

                hour12 =
                12;

            }


            return (

                String(
                    hour12
                )
                .padStart(
                    2,
                    "0"
                )

                +

                ":"

                +

                match[2]

                +

                (
                    match[3]
                    ?
                    ":" + match[3]
                    :
                    ""
                )

                +

                " "

                +

                suffix

            );

        }

    }


    return text;

}



/* =====================================================
   LEGACY DATE / TIME
===================================================== */

function splitDateTime(value){

    let result = {

        date:"",

        time:""

    };


    if(!value){

        return result;

    }


    let text =
    String(
        value
    )
    .trim();


    if(
        text.includes(",")
    ){

        let parts =
        text.split(
            ","
        );


        result.date =
        parts.shift()
        .trim();


        result.time =
        parts.join(",")
        .trim();


        return result;

    }


    result.date =
    text;


    return result;

}



/* =====================================================
   STATUS
===================================================== */

function statusClass(status){

    let value =
    String(
        status || ""
    )
    .trim()
    .toLowerCase();


    if(
        value === "pending"
    ){

        return "status-pending";

    }


    if(
        value === "success" ||
        value === "successful" ||
        value === "paid" ||
        value === "approved"
    ){

        return "status-success";

    }


    if(
        value === "win" ||
        value === "won"
    ){

        return "status-win";

    }


    if(
        value === "lose" ||
        value === "lost"
    ){

        return "status-lose";

    }


    if(
        value === "rejected" ||
        value === "blocked"
    ){

        return "status-rejected";

    }


    return "status-active";

}



/* =====================================================
   SORT TIME
===================================================== */

function getSortTime(item){

    let values = [

        item.timestamp,

        item.createdTimestamp,

        item.updatedTimestamp,

        item.id

    ];


    for(
        let value of values
    ){

        let number =
        Number(
            value
        );


        if(
            Number.isFinite(number) &&
            number > 0
        ){

            return number;

        }

    }


    if(
        item.createdAt
    ){

        let parsed =
        new Date(
            item.createdAt
        );


        if(
            !isNaN(
                parsed.getTime()
            )
        ){

            return parsed.getTime();

        }

    }


    return 0;

}



/* =====================================================
   USER MATCH
===================================================== */

function isCurrentUser(item){

    let current =
    normalizeMobile(
        currentUser.mobile
    );


    let recordMobile =
    normalizeMobile(

        item.mobile ||

        item.userMobile ||

        item.phone ||

        item.mobileNumber

    );


    return (

        recordMobile !== ""

        &&

        recordMobile ===
        current

    );

}



/* =====================================================
   DATA
===================================================== */

let currentHistory =
"game";


function arrayStorage(key){

    let value =
    getStorage(
        key,
        []
    );


    return Array.isArray(value)
    ? value
    : [];

}



/* =====================================================
   GAME HISTORY
===================================================== */

function getGameRecords(){

    return arrayStorage(
        "bets"
    )

    .filter(
        isCurrentUser
    )

    .map(
        function(item){

            let legacy =
            splitDateTime(
                item.date
            );


            let date =

            item.bidDate ||

            item.gameDate ||

            legacy.date ||

            item.date ||

            "-";


            let time =

            item.bidTime ||

            item.time ||

            legacy.time ||

            "-";


            return {

                type:
                item.market ||
                "Game",

                game:
                item.game ||
                item.gameType ||
                "-",

                number:
                item.number ??
                item.bidNumber ??
                "-",

                amount:
                Number(
                    item.amount ||
                    item.bidAmount ||
                    0
                ),

                balance:
                "-",

                date:
                date,

                time:
                formatTime12(
                    time
                ),

                status:
                item.status ||
                "Pending",

                direction:
                "debit",

                sortTime:
                getSortTime(
                    item
                )

            };

        }
    );

}



/* =====================================================
   DEPOSIT HISTORY
===================================================== */

function getDepositRecords(){

    return arrayStorage(
        "deposits"
    )

    .filter(
        isCurrentUser
    )

    .map(
        function(item){

            let legacy =
            splitDateTime(
                item.date
            );


            let displayTime =

            item.approvedTime ||

            item.time ||

            legacy.time ||

            "-";


            let status =
            item.status ||
            "Pending";


            return {

                type:
                "Deposit",

                game:
                item.paymentMode ||
                item.type ||
                "Deposit",

                number:
                item.utr ||
                item.transactionId ||
                item.requestId ||
                "-",

                amount:
                Number(
                    item.amount || 0
                ),

                balance:
                "-",

                date:
                item.approvedDate ||
                legacy.date ||
                item.date ||
                "-",

                time:
                formatTime12(
                    displayTime
                ),

                status:
                status,

                direction:
                (
                    String(status)
                    .toLowerCase()
                    === "approved"
                )
                ?
                "credit"
                :
                "none",

                sortTime:
                getSortTime(
                    item
                )

            };

        }
    );

}



/* =====================================================
   WITHDRAW HISTORY
===================================================== */

function getWithdrawRecords(){

    return arrayStorage(
        "withdrawals"
    )

    .filter(
        isCurrentUser
    )

    .map(
        function(item){

            let legacy =
            splitDateTime(
                item.date
            );


            let paid =
            String(
                item.status || ""
            )
            .toLowerCase()
            ===
            "paid";


            return {

                type:
                "Withdraw",

                game:
                item.paymentMode ||
                "-",

                number:
                item.requestId ||
                "-",

                amount:
                Number(
                    item.amount || 0
                ),

                balance:
                "-",

                date:
                paid
                ?
                (
                    item.paidDate ||
                    legacy.date ||
                    item.date ||
                    "-"
                )
                :
                (
                    legacy.date ||
                    item.date ||
                    "-"
                ),

                time:
                formatTime12(

                    paid

                    ?

                    (
                        item.paidTime ||
                        legacy.time ||
                        "-"
                    )

                    :

                    (
                        item.time ||
                        legacy.time ||
                        "-"
                    )

                ),

                status:
                item.status ||
                "Pending",

                direction:
                paid
                ?
                "debit"
                :
                "none",

                sortTime:
                getSortTime(
                    item
                )

            };

        }
    );

}



/* =====================================================
   WALLET PASSBOOK
   FINAL CREDIT / DEBIT ENGINE

   IMPORTANT:
   Bid Cancel Refund = CREDIT
   Winning = CREDIT
   Deposit = CREDIT

   Game Play / Bid = DEBIT
   Withdraw = DEBIT
===================================================== */

function getWalletRecords(){

    return arrayStorage(
        "passbook"
    )

    .filter(
        isCurrentUser
    )

    .map(
        function(item){

            let type =
            String(
                item.type || "Transaction"
            )
            .trim();


            let details =
            String(
                item.details || ""
            )
            .trim();


            let fullText =
            (
                type +
                " " +
                details
            )
            .toLowerCase();


            let direction =
            "none";


            /* =================================================
               1. REFUND / CANCEL REFUND
               HIGHEST PRIORITY = CREDIT

               Example:
               Bid Cancel Refund
               Bid Cancellation Refund
               Game Cancel Refund
               Refund
            ================================================= */

            if(
                fullText.includes(
                    "refund"
                )
                ||
                fullText.includes(
                    "cancel refund"
                )
                ||
                fullText.includes(
                    "cancelled refund"
                )
                ||
                fullText.includes(
                    "canceled refund"
                )
                ||
                fullText.includes(
                    "bid cancel"
                )
                ||
                fullText.includes(
                    "bid cancelled"
                )
                ||
                fullText.includes(
                    "bid canceled"
                )
            ){

                direction =
                "credit";

            }


            /* =================================================
               2. NORMAL CREDIT
            ================================================= */

            else if(
                fullText.includes(
                    "deposit"
                )
                ||
                fullText.includes(
                    "winning"
                )
                ||
                fullText.includes(
                    "winner"
                )
                ||
                fullText.includes(
                    "credit"
                )
                ||
                fullText.includes(
                    "add money"
                )
            ){

                direction =
                "credit";

            }


            /* =================================================
               3. NORMAL DEBIT
            ================================================= */

            else if(
                fullText.includes(
                    "withdraw"
                )
                ||
                fullText.includes(
                    "game play"
                )
                ||
                fullText.includes(
                    "bid play"
                )
                ||
                fullText.includes(
                    "bid amount"
                )
                ||
                fullText.includes(
                    "debit"
                )
            ){

                direction =
                "debit";

            }


            /* =================================================
               4. LEGACY BID ENTRY
               Refund ऊपर already handle हो चुका है.
            ================================================= */

            else if(
                fullText.includes(
                    "bid"
                )
            ){

                direction =
                "debit";

            }


            /* =================================================
               BALANCE
            ================================================= */

            let balanceText =
            "-";


            if(
                item.currentBalance !== undefined &&
                item.currentBalance !== null &&
                item.currentBalance !== ""
            ){

                let currentBalance =
                Number(
                    item.currentBalance || 0
                );


                if(
                    !Number.isFinite(
                        currentBalance
                    )
                ){

                    currentBalance =
                    0;

                }


                balanceText =

                "₹ " +
                currentBalance.toFixed(
                    2
                );

            }


            /* =================================================
               NUMBER / REFERENCE
            ================================================= */

            let reference =

            item.requestId ||

            item.betId ||

            item.settlementKey ||

            item.transactionId ||

            item.referenceId ||

            "-";


            /* =================================================
               RECORD
            ================================================= */

            return {

                type:
                type,

                game:
                item.details ||
                item.game ||
                item.market ||
                "-",

                number:
                reference,

                amount:
                Math.abs(
                    Number(
                        item.amount || 0
                    )
                ),

                balance:
                balanceText,

                date:
                item.date ||
                "-",

                time:
                formatTime12(
                    item.time ||
                    "-"
                ),

                status:
                item.status ||
                "Success",

                direction:
                direction,

                sortTime:
                getSortTime(
                    item
                )

            };

        }
    );

}

    if(
        currentHistory === "deposit"
    ){

        return getDepositRecords();

/* =====================================================
   RENDER SUMMARY
===================================================== */

function renderSummary(records){

    let credit =
    0;


    let debit =
    0;


    records.forEach(
        function(item){

            if(
                item.direction === "credit"
            ){

                credit +=
                Number(
                    item.amount || 0
                );

            }


            if(
                item.direction === "debit"
            ){

                debit +=
                Number(
                    item.amount || 0
                );

            }

        }
    );


    document
    .getElementById(
        "totalRecords"
    )
    .innerText =
    records.length;


    document
    .getElementById(
        "totalCredit"
    )
    .innerText =
    credit.toFixed(
        2
    );


    document
    .getElementById(
        "totalDebit"
    )
    .innerText =
    debit.toFixed(
        2
    );

}



/* =====================================================
   RENDER
===================================================== */

function renderCurrentHistory(){

    updateButtons();


    let records =
    getCurrentRecords();


    records.sort(
        function(a,b){

            return (

                Number(
                    b.sortTime
                )

                -

                Number(
                    a.sortTime
                )

            );

        }
    );


    let selectedDate =
    document
    .getElementById(
        "filterDate"
    )
    .value;


    let search =
    document
    .getElementById(
        "searchText"
    )
    .value
    .trim()
    .toLowerCase();


    records =
    records.filter(
        function(item){

            let dateMatch =
            true;


            if(
                selectedDate
            ){

                dateMatch =

                normalizeDate(
                    item.date
                )

                ===

                selectedDate;

            }


            let searchable =
            [

                item.type,

                item.game,

                item.number,

                item.amount,

                item.balance,

                item.date,

                item.time,

                item.status

            ]
            .join(
                " "
            )
            .toLowerCase();


            let searchMatch =

            search === ""

            ||

            searchable.includes(
                search
            );


            return (

                dateMatch

                &&

                searchMatch

            );

        }
    );


    renderSummary(
        records
    );


    let table =
    document
    .getElementById(
        "historyTable"
    );


    table.innerHTML =
    "";


    if(
        records.length === 0
    ){

        table.innerHTML = `

        <tr>

            <td
            colspan="9"
            class="noData">

                No History Found

            </td>

        </tr>

        `;


        return;

    }


    records.forEach(
        function(item,index){

            let amountClass =

            item.direction === "credit"

            ? "credit"

            :

            item.direction === "debit"

            ? "debit"

            :

            "";


            let amountPrefix =

            item.direction === "credit"

            ? "+ "

            :

            item.direction === "debit"

            ? "- "

            :

            "";


            let row =
            document.createElement(
                "tr"
            );


            row.innerHTML = `

            <td>
                ${index + 1}
            </td>


            <td>
                ${escapeHTML(
                    safe(
                        item.type
                    )
                )}
            </td>


            <td>
                ${escapeHTML(
                    safe(
                        item.game
                    )
                )}
            </td>


            <td>
                ${escapeHTML(
                    safe(
                        item.number
                    )
                )}
            </td>


            <td class="${amountClass}">

                ${amountPrefix}

                ₹ ${Number(
                    item.amount || 0
                )
                .toFixed(
                    2
                )}

            </td>


            <td>

                ${escapeHTML(
                    safe(
                        item.balance
                    )
                )}

            </td>


            <td>

                ${escapeHTML(
                    displayDate(
                        item.date
                    )
                )}

            </td>


            <td>

                ${escapeHTML(
                    formatTime12(
                        item.time
                    )
                )}

            </td>


            <td>

                <span
                class="
                status
                ${statusClass(
                    item.status
                )}
                ">

                    ${escapeHTML(
                        safe(
                            item.status
                        )
                    )}

                </span>

            </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}

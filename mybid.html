/* =====================================================
   1. STORAGE GET
===================================================== */

function getStorage(
    key,
    fallback
){

    try{

        let raw =
        localStorage.getItem(
            key
        );


        if(
            raw === null ||
            raw === undefined ||
            raw === ""
        ){

            return fallback;

        }


        return JSON.parse(
            raw
        );

    }
    catch(error){

        console.error(
            "Storage Read Error:",
            key,
            error
        );


        return fallback;

    }

}

/* =====================================================
   5. SAFE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value === undefined ||
        value === null
        ? ""
        : value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* =====================================================
   6. SAFE DISPLAY
===================================================== */

function safe(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "-";

    }


    return String(
        value
    );

}



/* =====================================================
   7. NORMALIZE MOBILE
===================================================== */

function normalizeMobile(value){

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    )
    .trim();

}

   8. WALLET
===================================================== */

        );

    }


    if(
        !Number.isFinite(

        )

/* =====================================================
   9. TODAY ISO
===================================================== */

function getTodayISO(){

    let now =
    new Date();


    let year =
    now.getFullYear();


    let month =
    String(
        now.getMonth()+1
    )
    .padStart(
        2,
        "0"
    );


    let day =
    String(
        now.getDate()
    )
    .padStart(
        2,
        "0"
    );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}



/* =====================================================
   10. NORMALIZE DATE
===================================================== */

function normalizeDate(value){

    if(!value){

        return "";

    }


    let text =
    String(value)
    .trim();


    /*
       DD/MM/YYYY
    */

    let slash =
    text.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})/
    );


    if(slash){

        return (
            slash[3]
            +
            "-"
            +
            String(
                slash[2]
            )
            .padStart(
                2,
                "0"
            )
            +
            "-"
            +
            String(
                slash[1]
            )
            .padStart(
                2,
                "0"
            )
        );

    }


    /*
       DD-MM-YYYY
    */

    let dash =
    text.match(
        /^(\d{1,2})-(\d{1,2})-(\d{4})/
    );


    if(dash){

        return (
            dash[3]
            +
            "-"
            +
            String(
                dash[2]
            )
            .padStart(
                2,
                "0"
            )
            +
            "-"
            +
            String(
                dash[1]
            )
            .padStart(
                2,
                "0"
            )
        );

    }


    /*
       YYYY-MM-DD
    */

    if(
        /^\d{4}-\d{2}-\d{2}/
        .test(text)
    ){

        return text.substring(
            0,
            10
        );

    }


    let parsed =
    new Date(
        text
    );


    if(
        isNaN(
            parsed.getTime()
        )
    ){

        return "";

    }


    return (

        parsed.getFullYear()

        +

        "-"

        +

        String(
            parsed.getMonth()+1
        )
        .padStart(
            2,
            "0"
        )

        +

        "-"

        +

        String(
            parsed.getDate()
        )
        .padStart(
            2,
            "0"
        )

    );

}



/* =====================================================
   11. DISPLAY DATE
===================================================== */

function displayDate(value){

    let normalized =
    normalizeDate(
        value
    );


    if(!normalized){

        return safe(
            value
        );

    }


    let parts =
    normalized.split(
        "-"
    );


    return (
        parts[2]
        +
        "/"
        +
        parts[1]
        +
        "/"
        +
        parts[0]
    );

}



/* =====================================================
   12. FORMAT TIME 12-HOUR AM/PM
===================================================== */

function formatTime12(value){

    if(
        !value ||
        value === "-"
    ){

        return "-";

    }


    let text =
    String(
        value
    )
    .trim();


    /*
       Already AM / PM
    */

    if(
        /\b(am|pm)\b/i
        .test(text)
    ){

        return text
        .replace(
            /\bam\b/gi,
            "AM"
        )
        .replace(
            /\bpm\b/gi,
            "PM"
        );

    }


    /*
       HH:MM
       HH:MM:SS
    */

    let match =
    text.match(
        /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );


    if(match){

        let hour =
        Number(
            match[1]
        );


        let minute =
        match[2];


        let second =
        match[3];


        if(
            hour >= 0 &&
            hour <= 23
        ){

            let suffix =
            hour >= 12
            ? "PM"
            : "AM";


            let hour12 =
            hour % 12;


            if(
                hour12 === 0
            ){

                hour12 =
                12;

            }


            return (

                String(
                    hour12
                )
                .padStart(
                    2,
                    "0"
                )

                +

                ":"

                +

                minute

                +

                (
                    second
                    ?
                    ":" + second
                    :
                    ""
                )

                +

                " "

                +

                suffix

            );

        }

    }


    return text;

}



/* =====================================================
   13. EXTRACT DATE/TIME FROM LEGACY FIELD
===================================================== */

function extractLegacyDateTime(value){

    let result = {

        date:"",

        time:""

    };


    if(!value){

        return result;

    }


    let text =
    String(
        value
    )
    .trim();


    /*
       "10/08/2026, 05:01:15 PM"
    */

    if(
        text.includes(",")
    ){

        let parts =
        text.split(
            ","
        );


        result.date =
        parts.shift()
        .trim();


        result.time =
        parts.join(",")
        .trim();


        return result;

    }


    /*
       If only date
    */

    if(
        normalizeDate(
            text
        )
    ){

        result.date =
        text;

        return result;

    }


    result.time =
    text;


    return result;

}

   14. STATUS NORMALIZE
===================================================== */

function normalizeStatus(value){

    let text =
    String(
        value ||
        "Pending"

    .toLowerCase();


    if(
        text === "won"

    if(

    }


    if(
        text === "canceled"
    ){

        return "Cancelled";

    }


    if(
        text === "win"
    ){

        return "Win";

    }


    if(
        text === "lose"
    ){

        return "Lose";

    }


    if(
        text === "cancelled"
    ){

        return "Cancelled";

    }


    if(
        text === "pending"
    ){

        return "Pending";

    }


    return (
        value ||
        "Pending"
    );

}



/* =====================================================
   15. STATUS CSS
===================================================== */

function statusClass(status){

    let value =
    String(
        status || ""
    )
    .trim()
    .toLowerCase();


    if(
        value === "pending"
    ){

        return "status-pending";

    }


    if(
        value === "win" ||
        value === "won"
    ){

        return "status-win";

    }


    if(
        value === "lose" ||
        value === "lost"
    ){

        return "status-lose";

    }


    if(
        value === "cancelled" ||
        value === "canceled"
    ){

        return "status-cancelled";

    }


    return "status-active";

}

    ){

        return [];

    }


    return bets;

}



/* =====================================================
   17. STRICT USER FILTER
===================================================== */

function getMyBids(){

    let currentMobile =
    normalizeMobile(
        currentUser.mobile
    );


    return getAllBets()
    .filter(
        function(item){

            let bidMobile =
            normalizeMobile(
                item.mobile ||
                item.userMobile ||
                item.phone ||
                item.mobileNumber
            );


            return (

                bidMobile !== ""

                &&

                bidMobile ===
                currentMobile

            );

        }
    );

}



/* =====================================================
   18. BET DATE/TIME
===================================================== */

function getBidDateTime(item){

    let legacy =
    extractLegacyDateTime(
        item.date ||
        item.createdAt ||
        ""
    );


    let date =
    item.bidDate ||
    item.displayDate ||
    item.gameDate ||
    item.playDate ||
    legacy.date ||
    "";


    let time =
    item.bidTime ||
    item.time ||
    item.playTime ||
    item.createdTime ||
    legacy.time ||
    "";


    /*
       If createdAt is ISO
    */

    if(
        (!date || !time) &&
        item.createdAt
    ){

        let parsed =
        new Date(
            item.createdAt
        );


        if(
            !isNaN(
                parsed.getTime()
            )
        ){

            if(!date){

                date =
                parsed.toLocaleDateString(
                    "en-GB"
                );

            }


            if(!time){

                time =
                parsed.toLocaleTimeString(
                    "en-US",
                    {
                        hour:"2-digit",
                        minute:"2-digit",
                        second:"2-digit",
                        hour12:true
                    }
                );

            }

        }

    }


    return {

        date:
        date || "-",

        time:
        formatTime12(
            time
        )

    };

}



/* =====================================================
   19. SORT TIMESTAMP
===================================================== */

function getSortTimestamp(item){

    if(
        Number.isFinite(
            Number(
                item.timestamp
            )
        )
        &&
        Number(
            item.timestamp
        ) > 0
    ){

        return Number(
            item.timestamp
        );

    }


    if(
        Number.isFinite(
            Number(
                item.createdTimestamp
            )
        )
        &&
        Number(
            item.createdTimestamp
        ) > 0
    ){

        return Number(
            item.createdTimestamp
        );

    }


    if(
        item.createdAt
    ){

        let parsed =
        new Date(
            item.createdAt
        );


        if(
            !isNaN(
                parsed.getTime()
            )
        ){

            return parsed.getTime();

        }

    }


    if(
        Number.isFinite(
            Number(
                item.id
            )
        )
    ){

        return Number(
            item.id
        );

    }


    return 0;

}



/* =====================================================
   20. NORMALIZE BID RECORD
===================================================== */

function normalizeBid(
    item,
    originalIndex
){

    let dt =
    getBidDateTime(
        item
    );


    let status =
    normalizeStatus(
        item.status
    );


    let amount =
    Number(
        item.amount ??
        item.bidAmount ??
        item.playAmount ??
        0
    );


    if(
        !Number.isFinite(
            amount
        )
    ){

        amount = 0;

    }


    let winAmount =
    Number(
        item.winAmount ??
        item.winningAmount ??
        0
    );


    if(
        !Number.isFinite(
            winAmount
        )
    ){

        winAmount = 0;

    }


    let session =
    String(
        item.session ||
        item.bidSession ||
        ""
    )
    .trim()
    .toUpperCase();


    if(!session){

        session =
        "-";

    }


    let game =
    item.game ||
    item.gameType ||
    item.type ||
    "-";


    let number =
    item.number ??
    item.bidNumber ??
    item.pana ??
    item.ank ??
    "-";


    return {

        originalIndex:
        originalIndex,

        id:
        item.id ||
        item.betId ||
        originalIndex + 1,

        market:
        item.market ||
        item.marketName ||
        "-",

        game:
        game,

        session:
        session,

        number:
        number,

        amount:
        amount,

        winAmount:
        winAmount,

        date:
        dt.date,

        normalizedDate:
        normalizeDate(
            dt.date
        ),

        time:
        dt.time,

        status:
        status,

        settlementPhase:
        item.settlementPhase ||
        "",

        resultNumber:
        item.resultNumber ??
        "",

        sortTime:
        getSortTimestamp(
            item
        )

    };

}



/* =====================================================
   21. GET NORMALIZED RECORDS
===================================================== */

function getBidRecords(){

    return getMyBids()
    .map(
        function(item,index){

            return normalizeBid(
                item,
                index
            );

        }
    );

}



/* =====================================================
   22. SUMMARY

   Summary always user's ALL bids ka hoga.
===================================================== */

function renderSummary(){

    let records =
    getBidRecords();


    let pending = 0;

    let win = 0;

    let lose = 0;


    records.forEach(
        function(item){

            let status =
            String(
                item.status || ""
            )
            .toLowerCase();


            if(
                status === "pending"
            ){

                pending++;

            }


            else if(
                status === "win" ||
                status === "won"
            ){

                win++;

            }


            else if(
                status === "lose" ||
                status === "lost"
            ){

                lose++;

            }

        }
    );


    document
    .getElementById(
        "totalBidCount"
    )
    .innerText =
    records.length;


    document
    .getElementById(
        "pendingCount"
    )
    .innerText =
    pending;


    document
    .getElementById(
        "winCount"
    )
    .innerText =
    win;


    document
    .getElementById(
        "loseCount"
    )
    .innerText =
    lose;

}



/* =====================================================
   23. FILTER RECORDS
===================================================== */

function getFilteredRecords(){

    let records =
    getBidRecords();


    records.sort(
        function(a,b){

            return (

                Number(
                    b.sortTime
                )

                -

                Number(
                    a.sortTime
                )

            );

        }
    );


    let selectedDate =
    document
    .getElementById(
        "filterDate"
    )
    .value;


    let search =
    document
    .getElementById(
        "searchText"
    )
    .value
    .trim()
    .toLowerCase();


    return records.filter(
        function(item){

            let dateMatch =
            true;


            if(
                selectedDate
            ){

                dateMatch =

                item.normalizedDate
                ===
                selectedDate;

            }


            let searchable =
            [

                item.id,

                item.market,

                item.game,

                item.session,

                item.number,

                item.amount,

                item.winAmount,

                item.date,

                item.time,

                item.status,

                item.resultNumber,

                item.settlementPhase

            ]
            .join(
                " "
            )
            .toLowerCase();


            let searchMatch =

            search === ""

            ||

            searchable.includes(
                search
            );


            return (
                dateMatch &&
                searchMatch
            );

        }
    );

}



/* =====================================================
   24. RENDER TABLE
===================================================== */

function renderMyBids(){

    let records =
    getFilteredRecords();


    let table =
    document
    .getElementById(
        "myBidTable"
    );


    table.innerHTML =
    "";


    document
    .getElementById(
        "recordInfo"
    )
    .innerText =

    "Total Records : "
    +
    records.length;


    if(
        records.length === 0
    ){

        table.innerHTML = `

        <tr>

            <td
            colspan="10"
            class="noData">

                No Bid History Found

            </td>

        </tr>

        `;


        renderSummary();

        return;

    }


    records.forEach(
        function(item,index){

            let displayWinAmount =

            String(
                item.status
            )
            .toLowerCase()
            ===
            "win"

            ?

            "₹ "
            +
            Number(
                item.winAmount
            )
            .toFixed(
                2
            )

            :

            "-";


            let row =
            document.createElement(
                "tr"
            );


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>


                <td>
                    ${escapeHTML(
                        safe(
                            item.market
                        )
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        safe(
                            item.game
                        )
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        safe(
                            item.session
                        )
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        safe(
                            item.number
                        )
                    )}
                </td>


                <td class="amountText">

                    ₹ ${Number(
                        item.amount
                    )
                    .toFixed(
                        2
                    )}

                </td>


                <td class="winAmount">

                    ${escapeHTML(
                        displayWinAmount
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        displayDate(
                            item.date
                        )
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        safe(
                            item.time
                        )
                    )}

                </td>


                <td>

                    <span
                    class="
                    status
                    ${statusClass(
                        item.status
                    )}
                    ">

                        ${escapeHTML(
                            safe(
                                item.status
                            )
                        )}

                    </span>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );


    renderSummary();

}

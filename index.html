<html lang="en">
<head>
<meta charset="UTF-8">

<style>

/* =========================================================
   HR MATKA USER APP - INDEX.HTML
   यह पूरी फाइल Single HTML File है:
   HTML + CSS + JavaScript एक ही फाइल में है।
   ========================================================= */


/* =========================================================
   1. MAIN COLORS
   कल को Background / Button Color बदलना हो तो सबसे पहले
   इसी :root सेक्शन में बदलाव करें।
   ========================================================= */
:root{
  --page-bg:#111111;          /* पूरे User App का Background */
  --header-bg:#171717;        /* ऊपर Header */
  --menu-bg:#111111;          /* 8 Main Buttons का Background */
  --menu-border:#d9b436;      /* 8 Buttons की Golden Border */
  --white:#ffffff;
  --text:#151515;
  --muted:#a6a6a6;
  --gold:#d9b436;
  --green:#48b657;
  --orange:#ff8a00;
  --red:#f44336;
  --gray:#b6b6b6;
  --blue:#0d55a5;
  --live:#ef233c;
  --shadow:0 8px 24px rgba(0,0,0,.16);
}


/* =========================================================
   2. BASIC RESET
   ========================================================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--page-bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:28px;
}

button{
  font:inherit;
}

.app{
  max-width:760px;
  margin:0 auto;
}


/* =========================================================
   3. TOP HEADER
   ========================================================= */
.header{
  background:var(--header-bg);
  color:#fff;
  min-height:92px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 4px 14px rgba(0,0,0,.28);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.logoWrap{
  width:64px;
  height:64px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex:0 0 auto;
  border:2px solid #fff;
}

.logoWrap img{
  width:88%;
  height:88%;
  object-fit:contain;
  background:#fff;
}

.brandName{
  font-size:25px;
  font-weight:800;
  white-space:nowrap;
  letter-spacing:.2px;
}

.headerActions{
  display:flex;
  align-items:center;
  gap:9px;
  flex:0 0 auto;
}

.walletPill{
  min-width:88px;
  height:52px;
  border-radius:28px;
  background:#252525;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:#63d86c;
  font-weight:800;
  padding:0 14px;
  font-size:18px;
}

.walletCoin{
  color:#ffcc18;
  font-size:20px;
}

.circleBtn{
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#252525;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
}

.circleBtn:active{
  transform:scale(.96);
}

.profileIcon{
  color:var(--gold);
  font-size:26px;
}


/* =========================================================
   4. LIVE NOTICE BAR
   ========================================================= */
.liveBar{
  background:linear-gradient(90deg,#ef233c,#ff1744);
  color:#fff;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  font-weight:700;
  overflow:hidden;
}

.liveDot{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#ffd1d7;
  flex:0 0 auto;
}

.liveLabel{
  flex:0 0 auto;
  font-size:14px;
}

.liveText{
  overflow:hidden;
  white-space:nowrap;
  flex:1;
}

.liveText span{
  display:inline-block;
  padding-left:100%;
  animation:marquee 18s linear infinite;
}

@keyframes marquee{
  0%{transform:translateX(0)}
  100%{transform:translateX(-100%)}
}

.menuLine{
  font-size:23px;
  flex:0 0 auto;
}


/* =========================================================
   5. BANNER / SLIDER
   ========================================================= */
.bannerBox{
  margin:12px 12px 10px;
  height:260px;
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:var(--shadow);
  position:relative;
}

.bannerBox img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.dots{
  position:absolute;
  left:18px;
  bottom:16px;
  display:flex;
  gap:8px;
}

.dot{
  width:13px;
  height:13px;
  border-radius:50%;
  background:rgba(255,255,255,.55);
}

.dot.active{
  background:#fff;
}


/* =========================================================
   6. 8 MAIN BUTTONS
   IMPORTANT:
   Deposit, Withdrawal, Admin, Rate List,
   My Bid, Passbook, Fund, Chart

   इन 8 Buttons का Background बदलना हो तो:
   --menu-bg ऊपर :root में बदलें।
   अभी इसे थोड़ा Dark रखा है ताकि साफ दिखे।
   ========================================================= */
.mainMenu{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:6px 12px 16px;
}

.menuCard{
  min-height:122px;
  border:2px solid var(--menu-border);
  border-radius:22px;
  background:var(--menu-bg);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.22);
  transition:.2s;
  text-align:center;
  padding:8px 5px;
}

.menuCard:hover{
  transform:translateY(-2px);
  background:#202020;
  box-shadow:0 7px 18px rgba(0,0,0,.28);
}

.menuIcon{
  font-size:34px;
  line-height:1;
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.menuLabel{
  font-size:15px;
  font-weight:800;
  color:#fff;
  
}

.whatsappIcon{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#24c768;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 0 0 2px #fff;
}

.whatsappIcon svg{
  width:27px;
  height:27px;
}


/* =========================================================
   7. MARKET LIST
   नीचे SRIDEVI / TIME BAZAR जैसे Cards
   ========================================================= */
.marketList{
  padding:4px 12px 16px;
}

.marketCard{
  background:#ffffff;
  border-radius:26px;
  margin-bottom:18px;
  padding:20px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  box-shadow:var(--shadow);
  cursor:pointer;
  min-height:178px;
}

.marketCard.holidayCard{

}

.leftAccent{

  align-self:stretch;
  min-height:128px;
  background:var(--gold);
  border-radius:10px;
  flex:0 0 auto;
}

.marketInfo{

  min-width:0;
}

.marketName{

  font-weight:900;

  margin-bottom:10px;

.resultText{

.marketTime{

.marketRight{

.statusCircle{

.status-running{

.status-running-close{

.status-closed{
  background:var(--red);
}

.status-holiday{

.statusText{

.playing{

.arrow{

/* =========================================================
   8. LOADING SCREEN + TOAST
   ========================================================= */
#loadingScreen{
  position:fixed;
  inset:0;
  background:var(--page-bg);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:15px;
  color:#fff;
}

.loaderLogo{

  height:92px;

  padding:10px;
  box-shadow:var(--shadow);

}

.loader{
  width:44px;
  height:44px;
  border:5px solid #555;
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .9s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.toast{
  position:fixed;
  left:50%;
  bottom:26px;
  transform:translateX(-50%) translateY(30px);
  background:#222;
  color:#fff;
  padding:11px 18px;
  border-radius:22px;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:3000;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

<script>
"use strict";

/* =========================================================
   HR MATKA USER HOME
   FINAL CLEAN JAVASCRIPT
   ========================================================= */


/* =========================================================
   12. SAFE LOCAL STORAGE FUNCTIONS
   ========================================================= */

function safeJSON(key, fallback){

  try{

    const raw =
    localStorage.getItem(key);

    if(!raw){
      return fallback;
    }

    return JSON.parse(raw);

  }
  catch(error){

    console.warn(
      "Storage parse error:",
      key,
      error
    );

    return fallback;
  }

}


/* =========================================================
   13. PAGE OPEN FUNCTION
   ========================================================= */

function go(page){

  window.location.href =
  page;

}


/* =========================================================
   14. SAFE TEXT HELPERS
   ========================================================= */

function norm(value){

  return String(
    value ?? ""
  ).trim();

}


function upper(value){

  return norm(value)
  .toUpperCase();

}


/* =========================================================
   15. RESULT DATE SCORE
   Latest Result निकालने के लिए
   ========================================================= */

function parseDateValue(value){

  if(!value){
    return 0;
  }

  const directDate =
  new Date(value);

  if(
    !isNaN(
      directDate.getTime()
    )
  ){

    return directDate.getTime();

  }


  const match =
  String(value).match(
    /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/
  );


  if(match){

    const fixedDate =
    new Date(
      Number(match[3]),
      Number(match[2]) - 1,
      Number(match[1])
    );

    return fixedDate.getTime();

  }

  return 0;

}


function getResultScore(item,index){

  const values = [

    item.updatedAt,

    item.lastUpdated,

    item.dateTime,

    (
      item.date &&
      item.time
    )
    ?
    (
      item.date +
      " " +
      item.time
    )
    :
    "",

    item.date

  ];


  let best = 0;


  values.forEach(function(value){

    const time =
    parseDateValue(value);

    if(time > best){

      best = time;

    }

  });


  if(best > 0){

    return best;

  }


  return index + 1;

}


/* =========================================================
   16. LATEST RESULT FOR ONE MARKET
   ========================================================= */

function getLatestResultForMarket(
  marketName
){

  const results =
  safeJSON(
    "results",
    []
  );


  const target =
  upper(marketName);


  const matches = [];


  results.forEach(
    function(result,index){

      if(
        upper(result.market) ===
        target
      ){

        matches.push({

          item:
          result,

          index:
          index,

          score:
          getResultScore(
            result,
            index
          )

        });

      }

    }
  );


  if(
    matches.length === 0
  ){

    return null;

  }


  matches.sort(
    function(a,b){

      if(
        a.score ===
        b.score
      ){

        return (
          a.index -
          b.index
        );

      }

      return (
        a.score -
        b.score
      );

    }
  );


  return matches[
    matches.length - 1
  ].item;

}


/* =========================================================
   17. TIME FORMAT
   24 Hour Time को AM/PM में बदलना
   ========================================================= */

function formatTime12(time24){

  const value =
  norm(time24);


  if(
    !value ||
    !value.includes(":")
  ){

    return (
      value ||
      "--:--"
    );

  }


  const parts =
  value.split(":");


  let hour =
  Number(
    parts[0]
  );


  const minute =
  parts[1] ||
  "00";


  if(
    Number.isNaN(hour)
  ){

    return value;

  }


  const ampm =
  hour >= 12
  ?
  "PM"
  :
  "AM";


  hour =
  hour % 12;


  if(
    hour === 0
  ){

    hour = 12;

  }


  return (
    String(hour)
    .padStart(2,"0")
    +
    ":"
    +
    minute
    +
    " "
    +
    ampm
  );

}


/* =========================================================
   18. CURRENT TIME
   ========================================================= */

function currentMinutes(){

  const now =
  new Date();


  return (
    now.getHours() * 60
    +
    now.getMinutes()
  );

}


function timeToMinutes(time){

  const value =
  norm(time);


  if(
    !value.includes(":")
  ){

    return null;

  }


  const parts =
  value.split(":");


  const hour =
  Number(parts[0]);


  const minute =
  Number(parts[1]);


  if(
    Number.isNaN(hour)
    ||
    Number.isNaN(minute)
  ){

    return null;

  }


  return (
    hour * 60
    +
    minute
  );

}


/* =========================================================
   19. RESULT TEXT
   OPEN RESULT:
   130-4*-***

   COMPLETE RESULT:
   130-45-678
   ========================================================= */

function makeMaskedResult(result){

  if(!result){

    return "***-**-***";

  }


  const openPanel =
  norm(
    result.openPanel
  );


  const openSingle =
  norm(
    result.openSingle
  );


  const closePanel =
  norm(
    result.closePanel
  );


  const closeSingle =
  norm(
    result.closeSingle
  );


  const jodi =
  norm(
    result.jodi
  );


  if(
    openPanel &&
    closePanel
  ){

    const middle =
    jodi ||
    (
      openSingle +
      closeSingle
    );


    return (
      openPanel +
      "-" +
      (
        middle ||
        "**"
      )
      +
      "-" +
      closePanel
    );

  }


  if(
    openPanel &&
    !closePanel
  ){

    return (
      openPanel +
      "-" +
      (
        openSingle ||
        "*"
      )
      +
      "*-***"
    );

  }


  if(
    norm(result.result)
  ){

    return norm(
      result.result
    );

  }


  return "***-**-***";

}


/* =========================================================
   20. WALLET BALANCE
   Wallet userBalances से आएगा
   ========================================================= */

function loadWallet(){

  const currentUser =
  safeJSON(
    "currentUser",
    {}
  );


  const balances =
  safeJSON(
    "userBalances",
    {}
  );


  const mobile =
  norm(
    currentUser.mobile
  );


  let balance = 0;


  if(mobile){

    balance =
    Number(
      balances[mobile] ||
      0
    );

  }


  if(
    !Number.isFinite(
      balance
    )
  ){

    balance = 0;

  }


  const walletElement =
  document.getElementById(
    "walletBalance"
  );


  if(walletElement){

    walletElement.textContent =
    balance % 1 === 0
    ?
    balance.toFixed(0)
    :
    balance.toFixed(2);

  }

}


/* =========================================================
   21. MARKET STATUS ENGINE

   GREEN  = RUNNING
   ORANGE = RUNNING CLOSE
   RED    = CLOSED
   GREY   = HOLIDAY
   ========================================================= */

function getMarketState(item){

  const result =
  getLatestResultForMarket(
    item.market
  );


  const manualStatus =
  upper(
    item.manualStatus ||
    "AUTO"
  );


  const gameStatus =
  upper(
    item.gameStatus ||
    ""
  );


  const hasOpen =
  Boolean(
    result &&
    norm(
      result.openPanel
    )
  );


  const hasClose =
  Boolean(
    result &&
    norm(
      result.closePanel
    )
  );


  /* -----------------------------------------
     1. HOLIDAY
     ----------------------------------------- */

  if(
    manualStatus ===
    "HOLIDAY"
  ){

    return {

      phase:
      "HOLIDAY",

      label:
      "Holiday",

      icon:
      "✕",

      circleClass:
      "status-holiday",

      playingClass:
      "gray",

      resultText:
      makeMaskedResult(
        result
      ),

      clickable:
      false

    };

  }


  /* -----------------------------------------
     2. CLOSE RESULT COMPLETE
     ----------------------------------------- */

  if(
    hasClose
    ||
    gameStatus ===
    "CLOSE"
    ||
    gameStatus ===
    "RESULT_COMPLETE"
  ){

    return {

      phase:
      "CLOSED",

      label:
      "CLOSED",

      icon:
      "✕",

      circleClass:
      "status-closed",

      playingClass:
      "gray",

      resultText:
      makeMaskedResult(
        result
      ),

      clickable:
      true

    };

  }


  /* -----------------------------------------
     3. OPEN RESULT DECLARED
     अब RUNNING CLOSE Orange दिखेगा
     ----------------------------------------- */

  if(
    hasOpen
    ||
    gameStatus ===
    "OPEN_RESULT"
  ){

    return {

      phase:
      "RUNNING_CLOSE",

      label:
      "RUNNING CLOSE",

      icon:
      "◷",

      circleClass:
      "status-running-close",

      playingClass:
      "orange",

      resultText:
      makeMaskedResult(
        result
      ),

      clickable:
      true

    };

  }


  /* -----------------------------------------
     4. MANUAL CLOSE
     ----------------------------------------- */

  if(
    manualStatus ===
    "CLOSE"
  ){

    return {

      phase:
      "CLOSED",

      label:
      "CLOSED",

      icon:
      "✕",

      circleClass:
      "status-closed",

      playingClass:
      "gray",

      resultText:
      makeMaskedResult(
        result
      ),

      clickable:
      true

    };

  }


  /* -----------------------------------------
     5. MANUAL OPEN
     ----------------------------------------- */

  if(
    manualStatus ===
    "OPEN"
  ){

    return {

      phase:
      "RUNNING",

      label:
      "RUNNING",

      icon:
      "▶",

      circleClass:
      "status-running",

      playingClass:
      "green",

      resultText:
      makeMaskedResult(
        result
      ),

      clickable:
      true

    };

  }


  /* -----------------------------------------
     6. AUTO TIME
     ----------------------------------------- */

  const now =
  currentMinutes();


  const open =
  timeToMinutes(
    item.openTime
  );


  const close =
  timeToMinutes(
    item.closeTime
  );


  if(
    open !== null
    &&
    close !== null
    &&
    now >= open
    &&
    now <= close
  ){

    return {

      phase:
      "RUNNING",

      label:
      "RUNNING",

      icon:
      "▶",

      circleClass:
      "status-running",

      playingClass:
      "green",

      resultText:
      makeMaskedResult(
        result
      ),

      clickable:
      true

    };

  }


  return {

    phase:
    "CLOSED",

    label:
    "CLOSED",

    icon:
    "✕",

    circleClass:
    "status-closed",

    playingClass:
    "gray",

    resultText:
    makeMaskedResult(
      result
    ),

    clickable:
    true

  };

}


/* =========================================================
   22. PLAYING COUNT
   ========================================================= */

function stablePlayingCount(
  item,
  state
){

  if(
    state.phase ===
    "HOLIDAY"
  ){

    return "";

  }


  if(
    item.playingCount !==
    undefined
    &&
    item.playingCount !==
    null
  ){

    const number =
    Number(
      item.playingCount
    );


    if(
      Number.isFinite(
        number
      )
    ){

      return Math.max(
        0,
        Math.floor(
          number
        )
      );

    }

  }


  let hash = 0;


  const text =
  norm(
    item.market
  );


  for(
    let i=0;
    i<text.length;
    i++
  ){

    hash =
    (
      hash * 31
      +
      text.charCodeAt(i)
    )
    >>>
    0;

  }


  return (
    7000
    +
    (
      hash %
      8500
    )
  );

}


/* =========================================================
   23. HTML ESCAPE
   ========================================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =========================================================
   24. RENDER ALL MARKETS
   ========================================================= */

function renderMarkets(){

  const container =
  document.getElementById(
    "marketContainer"
  );


  if(!container){

    return;

  }


  let markets =
  safeJSON(
    "markets",
    []
  );


  if(
    !Array.isArray(
      markets
    )
  ){

    markets = [];

  }


  if(
    markets.length === 0
  ){

    container.innerHTML = `

      <div class="emptyMarkets">

        <div
          style="
          font-size:34px;
          margin-bottom:8px;
          ">

          📋

        </div>

        <b>
          No Market Found
        </b>

        <br>

        <span
          style="
          font-size:13px;
          ">

          Admin Market Setting se market add kijiye.

        </span>

      </div>

    `;

    return;

  }


  markets =
  [...markets]
  .sort(
    function(a,b){

      return norm(
        a.openTime
      )
      .localeCompare(
        norm(
          b.openTime
        )
      );

    }
  );


  container.innerHTML = "";


  markets.forEach(
    function(item){

      const state =
      getMarketState(
        item
      );


      const count =
      stablePlayingCount(
        item,
        state
      );


      const card =
      document.createElement(
        "div"
      );


      card.className =
      "marketCard"
      +
      (
        state.phase ===
        "HOLIDAY"
        ?
        " holidayCard"
        :
        ""
      );


      if(
        state.clickable
      ){

        card.addEventListener(
          "click",
          function(){

            window.location.href =
            "marketgame.html?market="
            +
            encodeURIComponent(
              norm(
                item.market
              )
            );

          }
        );

      }


      const playingText =
      state.phase ===
      "HOLIDAY"
      ?
      "Holiday"
      :
      (
        count +
        " Playing"
      );


      card.innerHTML = `

        <div class="leftAccent"></div>


        <div class="marketInfo">

          <div class="marketName">

            ${escapeHTML(
              item.market
            )}

          </div>


          <div class="resultText">

            ${escapeHTML(
              state.resultText
            )}

          </div>


          <div class="marketTime">

            ${escapeHTML(
              formatTime12(
                item.openTime
              )
            )}

            -

            ${escapeHTML(
              formatTime12(
                item.closeTime
              )
            )}

          </div>

        </div>


        <div class="marketRight">


          <div
            class="
            statusCircle
            ${state.circleClass}
            ">

            ${state.icon}

          </div>


          <div class="statusText">

            ${escapeHTML(
              state.label
            )}

          </div>


          <div
            class="
            playing
            ${state.playingClass}
            ">

            ${escapeHTML(
              playingText
            )}

          </div>


        </div>


        <div class="arrow">

          ›

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   25. BANNER SLIDER
   images folder में:
   banner1.jpeg
   banner2.jpeg
   banner3.jpeg
   banner4.jpeg
   ========================================================= */

const sliderImages = [

  "images/banner1.jpeg",

  "images/banner2.jpeg",

  "images/banner3.jpeg",

  "images/banner4.jpeg"

];


let currentSlide = 0;


function renderDots(){

  const dots =
  document.getElementById(
    "sliderDots"
  );


  if(!dots){

    return;

  }


  dots.innerHTML =
  sliderImages
  .map(
    function(_,index){

      return `

        <span
          class="
          dot
          ${
            index ===
            currentSlide
            ?
            "active"
            :
            ""
          }
          ">
        </span>

      `;

    }
  )
  .join("");

}


function showSlide(index){

  const image =
  document.getElementById(
    "sliderImage"
  );


  if(!image){

    return;

  }


  currentSlide =
  index %
  sliderImages.length;


  image.src =
  sliderImages[
    currentSlide
  ];


  renderDots();

}


function startSlider(){

  renderDots();


  setInterval(
    function(){

      showSlide(
        currentSlide + 1
      );

    },
    3500
  );

}


/* =========================================================
   26. TOAST MESSAGE
   ========================================================= */

let toastTimer = null;


function showToast(message){

  const toast =
  document.getElementById(
    "toast"
  );


  if(!toast){

    return;

  }


  toast.textContent =
  message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
  setTimeout(
    function(){

      toast.classList.remove(
        "show"
      );

    },
    1300
  );

}

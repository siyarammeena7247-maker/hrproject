<style>


*{

body{

}

}

height:48px;

}

}

}

}



input{

@media(max-width:768px){

.marketTitle{

}

.walletBox{

}

.dateSection{

}

.grid{
grid-template-columns:repeat(4,1fr);
}

.grid button{

padding:12px;
}

}

}

</style>

<script>

// =====================================================
// HR MATKA
// COMPACT SINGLE PANA
// PART 11 - FINAL JAVASCRIPT
// =====================================================


// =====================================================
// 1. BASIC DATA
// =====================================================

let currentUser =
JSON.parse(localStorage.getItem("currentUser")) || {};

let balances =
JSON.parse(localStorage.getItem("userBalances")) || {};

let markets =
JSON.parse(localStorage.getItem("markets")) || [];

let currentMarket = null;

let currentSession = "OPEN";

let selectedAnk = "0";

let totalPoints = 0;


// =====================================================
// 2. URL MARKET NAME
// =====================================================

const urlParams =
new URLSearchParams(window.location.search);

const marketName =
(urlParams.get("market") || "").trim();


// =====================================================
// 3. OFFICIAL SINGLE PANA LIST
// 120 UNIQUE PANAS
// 12 PANAS FOR EACH ANK
// =====================================================

const singlePanaGroups = {

"0":[
"127","136","145","190",
"235","280","370","389",
"460","479","569","578"
],

"1":[
"128","137","146","236",
"245","290","380","470",
"489","560","579","678"
],

"2":[
"129","138","147","156",
"237","246","345","390",
"480","570","589","679"
],

"3":[
"120","139","148","157",
"238","247","256","346",
"490","580","670","689"
],

"4":[
"130","149","158","167",
"239","248","257","347",
"356","590","680","789"
],

"5":[
"140","159","168","230",
"249","258","267","348",
"357","456","690","780"
],

"6":[
"123","150","169","178",
"240","259","268","349",
"358","367","457","790"
],

"7":[
"124","160","179","250",
"269","278","340","359",
"368","458","467","890"
],

"8":[
"125","134","170","189",
"260","279","350","369",
"378","459","468","567"
],

"9":[
"126","135","180","234",
"270","289","360","379",
"450","469","478","568"
]

};

// =====================================================
// 4. SAFE TEXT FUNCTION
// =====================================================

function setText(id,value){

let element =
document.getElementById(id);

if(element){

element.innerText = value;

}

}


// =====================================================
// 5. LOAD WALLET
// =====================================================

function loadWallet(){

currentUser =
JSON.parse(localStorage.getItem("currentUser")) || {};

balances =
JSON.parse(localStorage.getItem("userBalances")) || {};

if(!currentUser.mobile){

setText("wallet","0");
setText("topWallet","0");

return;

}

let wallet =
Number(
balances[currentUser.mobile] || 0
);

setText(
"wallet",
wallet.toFixed(2)
);

setText(
"topWallet",
wallet.toFixed(2)
);

}


// =====================================================
// 6. LOAD MARKET
// =====================================================

function loadMarket(){

if(!marketName){

alert("Market Not Found");

history.back();

return false;

}

markets =
JSON.parse(localStorage.getItem("markets")) || [];

currentMarket =
markets.find(function(item){

return (
String(item.market || "").trim() ===
marketName
);

}) || null;

if(!currentMarket){

alert("Market Data Missing");

history.back();

return false;

}

setText(
"marketTitle",
currentMarket.market + " [Single Pana]"
);

return true;

}


// =====================================================
// 7. LOAD TODAY DATE
// =====================================================

function loadTodayDate(){

let today =
new Date();

let dd =
String(today.getDate()).padStart(2,"0");

let mm =
String(today.getMonth()+1).padStart(2,"0");

let yyyy =
today.getFullYear();

setText(
"todayDate",
dd + "-" + mm + "-" + yyyy
);

}


// =====================================================
// 8. GET LATEST RESULT
// =====================================================

function getLatestMarketResult(){

let results =
JSON.parse(localStorage.getItem("results")) || [];

let marketResults =
results.filter(function(item){

return (
String(item.market || "").trim() ===
String(currentMarket.market || "").trim()
);

});

if(marketResults.length === 0){

return null;

}

return marketResults[
marketResults.length - 1
];

}


// =====================================================
// 9. SESSION ENGINE
//
// FRESH MARKET
// OPEN + CLOSE AVAILABLE
//
// OPEN RESULT
// ONLY CLOSE AVAILABLE
//
// CLOSE RESULT
// COMPLETE LOCK
// =====================================================

function loadSession(){

if(!currentMarket){

currentSession = "CLOSED";

return;

}

let sessionSelect =
document.getElementById("sessionSelect");

if(!sessionSelect){

return;

}

markets =
JSON.parse(localStorage.getItem("markets")) || [];

let liveMarket =
markets.find(function(item){

return (
String(item.market || "").trim() ===
String(currentMarket.market || "").trim()
);

});

if(!liveMarket){

currentSession = "CLOSED";

sessionSelect.disabled = true;

return;

}


let manualStatus =
String(
liveMarket.manualStatus || "OPEN"
).toUpperCase();


let gameStatus =
String(
liveMarket.gameStatus || ""
).toUpperCase();


let latestResult =
getLatestMarketResult();


let hasOpenResult =
Boolean(
latestResult &&
latestResult.openPanel &&
String(latestResult.openPanel).trim() !== ""
);


let hasCloseResult =
Boolean(
latestResult &&
latestResult.closePanel &&
String(latestResult.closePanel).trim() !== ""
);


// -----------------------------------------------------
// HOLIDAY
// -----------------------------------------------------

if(manualStatus === "HOLIDAY"){

currentSession = "HOLIDAY";

sessionSelect.disabled = true;

return;

}


// -----------------------------------------------------
// CLOSE RESULT = COMPLETE MARKET CLOSED
// -----------------------------------------------------

if(
hasCloseResult ||
gameStatus === "CLOSE" ||
gameStatus === "RESULT_COMPLETE" ||
manualStatus === "CLOSE"
){

currentSession = "CLOSED";

sessionSelect.value = "CLOSE";

sessionSelect.disabled = true;

return;

}


// -----------------------------------------------------
// OPEN RESULT = ONLY CLOSE SESSION
// -----------------------------------------------------

if(
hasOpenResult ||
gameStatus === "OPEN_RESULT"
){

currentSession = "CLOSE";

sessionSelect.value = "CLOSE";

let openOption =
sessionSelect.querySelector(
'option[value="OPEN"]'
);

if(openOption){

openOption.disabled = true;

}

sessionSelect.disabled = false;

return;

}


// -----------------------------------------------------
// FRESH MARKET
// OPEN + CLOSE BOTH AVAILABLE
// -----------------------------------------------------

let openOption =
sessionSelect.querySelector(
'option[value="OPEN"]'
);

if(openOption){

openOption.disabled = false;

}

sessionSelect.disabled = false;

currentSession =
sessionSelect.value || "OPEN";

}


// =====================================================
// 10. SESSION CHANGE
// =====================================================

let sessionSelectElement =
document.getElementById("sessionSelect");

if(sessionSelectElement){

sessionSelectElement.addEventListener(
"change",
function(){

if(
currentSession === "CLOSED" ||
currentSession === "HOLIDAY"
){

return;

}

currentSession =
this.value;

}

);

}


// =====================================================
// 11. LOAD SELECTED ANK PANAS
// =====================================================

function loadSinglePana(){

let container =
document.getElementById("singlePanaGrid");

if(!container){

return;

}

container.innerHTML = "";

let panaList =
singlePanaGroups[selectedAnk] || [];


panaList.forEach(function(pana){

container.innerHTML += `

<div class="compactPanaRow">

<div class="compactPanaNumber">

${pana}

</div>

<input
type="number"
inputmode="numeric"
min="0"
class="compactPanaInput"
data-pana="${pana}"
placeholder="Points"
autocomplete="off">

</div>

`;

});


connectPanaInputs();

calculateTotalPoints();

updateGameLock();

}


// =====================================================
// 12. ANK TAB SYSTEM
// =====================================================

function connectAnkTabs(){

let tabs =
document.querySelectorAll(".ankTab");

tabs.forEach(function(tab){

tab.addEventListener(
"click",
function(){

if(
currentSession === "CLOSED" ||
currentSession === "HOLIDAY"
){

return;

}


// -------------------------------------
// पहले Current Ank के Filled Points Check
// -------------------------------------

let oldInputs =
document.querySelectorAll(
".compactPanaInput"
);

let hasPoints = false;

oldInputs.forEach(function(input){

if(Number(input.value) > 0){

hasPoints = true;

}

});


// Points भरे हैं तो गलती से Tab Change रोकना

if(hasPoints){

let allowChange =
confirm(
"Current Ank me Points bhare hue hain.\n\nAnk change karne par ye Points clear ho jayenge.\n\nContinue?"
);

if(!allowChange){

return;

}

}


selectedAnk =
String(this.dataset.ank);


tabs.forEach(function(item){

item.classList.remove("active");

});


this.classList.add("active");


setText(
"selectedAnk",
selectedAnk
);


loadSinglePana();

}

);

});

}


// =====================================================
// 13. GET CURRENT PANA INPUTS
// =====================================================

function getPanaInputs(){

return document.querySelectorAll(
".compactPanaInput"
);

}


// =====================================================
// 14. CONNECT POINT INPUTS
// =====================================================

function connectPanaInputs(){

let inputs =
getPanaInputs();

inputs.forEach(function(input){


// -------------------------------------
// LIVE TOTAL
// -------------------------------------

input.addEventListener(
"input",
function(){

if(Number(this.value) < 0){

this.value = "";

}

calculateTotalPoints();

}

);


// -------------------------------------
// MOUSE WHEEL LOCK
// -------------------------------------

input.addEventListener(
"wheel",
function(event){

event.preventDefault();

this.blur();

},
{
passive:false
}

);


// -------------------------------------
// KEYBOARD ARROW LOCK
// -------------------------------------

input.addEventListener(
"keydown",
function(event){

if(
event.key === "ArrowUp" ||
event.key === "ArrowDown"
){

event.preventDefault();

}

}

);

});

}


// =====================================================
// 15. CALCULATE BID COUNT + TOTAL POINTS
// =====================================================

function calculateTotalPoints(){

totalPoints = 0;

let bidCount = 0;

let inputs =
getPanaInputs();

inputs.forEach(function(input){

let points =
Number(input.value);

if(points > 0){

totalPoints += points;

bidCount++;

}

});


setText(
"totalPoints",
totalPoints
);

setText(
"bidCount",
bidCount
);

}


// =====================================================
// 16. MARKET PERMISSION
// =====================================================

function isMarketOpen(){

if(!currentMarket){

return false;

}

if(
currentSession === "CLOSED" ||
currentSession === "HOLIDAY"
){

return false;

}

return true;

}


// =====================================================
// 17. LIVE GAME LOCK
// =====================================================

function updateGameLock(){

if(!currentMarket){

return;

}

loadSession();


let submitBtn =
document.getElementById("submitBtn");

let sessionSelect =
document.getElementById("sessionSelect");

let panaInputs =
getPanaInputs();

let ankTabs =
document.querySelectorAll(".ankTab");


let shouldLock =
currentSession === "CLOSED" ||
currentSession === "HOLIDAY";


// -----------------------------------------------------
// PANA INPUT LOCK
// -----------------------------------------------------

panaInputs.forEach(function(input){

input.disabled =
shouldLock;

input.style.opacity =
shouldLock ? ".35" : "1";

});


// -----------------------------------------------------
// ANK TAB LOCK
// -----------------------------------------------------

ankTabs.forEach(function(tab){

tab.disabled =
shouldLock;

tab.style.opacity =
shouldLock ? ".35" : "1";

});


// -----------------------------------------------------
// SUBMIT LOCK
// -----------------------------------------------------

if(submitBtn){

submitBtn.disabled =
shouldLock;

submitBtn.style.opacity =
shouldLock ? ".45" : "1";

submitBtn.style.cursor =
shouldLock
? "not-allowed"
: "pointer";

}


// -----------------------------------------------------
// SESSION LOCK
// -----------------------------------------------------

if(
sessionSelect &&
shouldLock
){

sessionSelect.disabled = true;

}

}


// =====================================================
// 18. FINAL VALIDATION
// =====================================================

const MIN_POINTS = 10;


function finalValidation(){

loadSession();

calculateTotalPoints();


if(!isMarketOpen()){

alert(
currentSession === "HOLIDAY"
? "Market Holiday"
: "Market Closed"
);

return false;

}


let filledBids = [];

getPanaInputs().forEach(function(input){

let points =
Number(input.value);

if(points > 0){

filledBids.push({

pana:
String(input.dataset.pana),

amount:
points

});

}

});


if(filledBids.length === 0){

alert(
"Please Enter Points"
);

return false;

}


// -----------------------------------------------------
// EACH FILLED PANA MINIMUM ₹10
// -----------------------------------------------------

let invalidBid =
filledBids.find(function(item){

return item.amount < MIN_POINTS;

});

if(invalidBid){

alert(
"Pana " +
invalidBid.pana +
" par Minimum ₹" +
MIN_POINTS +
" Points Required"
);

return false;

}


// -----------------------------------------------------
// WALLET CHECK
// -----------------------------------------------------

balances =
JSON.parse(localStorage.getItem("userBalances")) || {};

let wallet =
Number(
balances[currentUser.mobile] || 0
);

if(totalPoints > wallet){

alert(
"Insufficient Wallet Balance"
);

return false;

}

return true;

}


// =====================================================
// 19. SUBMIT BID
// =====================================================

function submitBid(){

// Latest Data Check

loadSession();

calculateTotalPoints();


if(!isMarketOpen()){

alert(
currentSession === "HOLIDAY"
? "Market Holiday"
: "Market Closed"
);

return;

}


// -----------------------------------------------------
// SESSION
// -----------------------------------------------------

let sessionSelect =
document.getElementById("sessionSelect");


if(
sessionSelect &&
!sessionSelect.disabled
){

currentSession =
sessionSelect.value;

}


let gameName = "";


if(currentSession === "OPEN"){

gameName =
"Single Pana Open";

}
else if(currentSession === "CLOSE"){

gameName =
"Single Pana Close";

}
else{

alert("Market Closed");

return;

}


// -----------------------------------------------------
// FILLED BIDS
// -----------------------------------------------------

let filledBids = [];


getPanaInputs().forEach(function(input){

let points =
Number(input.value);

if(points > 0){

filledBids.push({

number:
String(input.dataset.pana),

amount:
points

});

}

});


if(filledBids.length === 0){

alert("Please Enter Points");

return;

}


// -----------------------------------------------------
// LATEST WALLET
// -----------------------------------------------------

balances =
JSON.parse(localStorage.getItem("userBalances")) || {};

let wallet =
Number(
balances[currentUser.mobile] || 0
);


if(totalPoints > wallet){

alert(
"Insufficient Wallet Balance"
);

return;

}


let previousBalance =
wallet;


// -----------------------------------------------------
// DATE + TIME
// -----------------------------------------------------

let now =
new Date();


let date =
now.toLocaleDateString("en-GB");


let time =
now.toLocaleTimeString(
"en-US",
{

hour:"2-digit",

minute:"2-digit",

second:"2-digit",

hour12:true

}
);


// -----------------------------------------------------
// LOAD STORAGE
// -----------------------------------------------------

let bets =
JSON.parse(localStorage.getItem("bets")) || [];

let todayPlay =
JSON.parse(localStorage.getItem("todayPlay")) || [];

let passbook =
JSON.parse(localStorage.getItem("passbook")) || [];


// =====================================================
// 20. DUPLICATE SESSION CONFIRMATION
// =====================================================

let previousBidExists =
bets.some(function(item){

return (

item.mobile == currentUser.mobile &&

item.market == currentMarket.market &&

item.game == gameName &&

item.date == date &&

item.status == "Pending"

);

});


if(previousBidExists){

let allowAgain =
confirm(

"Is Market aur Session me pehle se Single Pana Bid lagi hai.\n\nKya dobara Bid lagani hai?"

);

if(!allowAgain){

return;

}

}


// =====================================================
// 21. SAVE / MERGE EVERY FILLED PANA
// =====================================================

filledBids.forEach(function(newBid){

let oldBet =
bets.find(function(item){

return (

item.mobile == currentUser.mobile &&

item.market == currentMarket.market &&

item.game == gameName &&

String(item.number) == newBid.number &&

item.date == date &&

item.status == "Pending"

);

});


if(oldBet){

oldBet.amount =
Number(oldBet.amount) +
Number(newBid.amount);

oldBet.updatedTime =
time;

}
else{

bets.push({

id:
Date.now() +
Math.random(),

mobile:
currentUser.mobile,

name:
currentUser.name || "",

market:
currentMarket.market,

game:
gameName,

gameType:
"Single Pana",

session:
currentSession,

ank:
selectedAnk,

number:
newBid.number,

amount:
Number(newBid.amount),

winRate:
150,

winAmount:
0,

date:
date,

time:
time,

status:
"Pending"

});

}

});


// =====================================================
// 22. WALLET DEDUCT
// =====================================================

let currentBalance =
wallet - totalPoints;


balances[currentUser.mobile] =
currentBalance;


// =====================================================
// 23. TODAY PLAY
// =====================================================

todayPlay.push({

id:
Date.now() +
Math.random(),

mobile:
currentUser.mobile,

name:
currentUser.name || "",

market:
currentMarket.market,

game:
gameName,

gameType:
"Single Pana",

session:
currentSession,

amount:
totalPoints,

date:
date,

time:
time,

status:
"Success"

});


// =====================================================
// 24. PASSBOOK
// =====================================================

passbook.push({

id:
Date.now() +
Math.random(),

mobile:
currentUser.mobile,

date:
date,

time:
time,

type:
"Game Play",

previousBalance:
previousBalance,

amount:
totalPoints,

currentBalance:
currentBalance,

status:
"Success",

details:
currentMarket.market +
" - " +
gameName

});


// =====================================================
// 25. SAVE EVERYTHING
// =====================================================

localStorage.setItem(
"bets",
JSON.stringify(bets)
);


localStorage.setItem(
"userBalances",
JSON.stringify(balances)
);


localStorage.setItem(
"todayPlay",
JSON.stringify(todayPlay)
);


localStorage.setItem(
"passbook",
JSON.stringify(passbook)
);


// =====================================================
// 26. ADMIN AUTO SYNC
// =====================================================

localStorage.setItem(

"lastBetSync",

JSON.stringify({

mobile:
currentUser.mobile,

market:
currentMarket.market,

game:
gameName,

gameType:
"Single Pana",

session:
currentSession,

amount:
totalPoints,

date:
date,

time:
time,

updatedAt:
Date.now()

})

);


window.dispatchEvent(
new Event("betUpdated")
);


// =====================================================
// 27. UPDATE WALLET
// =====================================================

setText(
"wallet",
currentBalance.toFixed(2)
);

setText(
"topWallet",
currentBalance.toFixed(2)
);


// =====================================================
// 28. SUCCESS
// =====================================================

alert(

gameName +
"\nBid Submitted Successfully"

);


// Clear Current Inputs

getPanaInputs().forEach(function(input){

input.value = "";

});


totalPoints = 0;

setText(
"totalPoints",
"0"
);

setText(
"bidCount",
"0"
);

}


// =====================================================
// 29. SUBMIT BUTTON
// =====================================================

let submitButton =
document.getElementById("submitBtn");


if(submitButton){

submitButton.addEventListener(
"click",
function(){

if(finalValidation()){

submitBid();

}

}

);

}


// =====================================================
// 30. FIRST LOAD
// =====================================================

function startSinglePana(){

loadWallet();

if(!loadMarket()){

return;

}

loadTodayDate();

loadSession();

connectAnkTabs();

setText(
"selectedAnk",
selectedAnk
);

loadSinglePana();

updateGameLock();

}


startSinglePana();


// =====================================================
// 31. AUTO LIVE REFRESH
// =====================================================

setInterval(function(){

balances =
JSON.parse(localStorage.getItem("userBalances")) || {};

markets =
JSON.parse(localStorage.getItem("markets")) || [];

loadWallet();

updateGameLock();

},2000);


// =====================================================
// 32. OTHER TAB UPDATE
// =====================================================

window.addEventListener(
"storage",
function(event){

if(
event.key === "markets" ||
event.key === "results" ||
event.key === "userBalances"
){

balances =
JSON.parse(localStorage.getItem("userBalances")) || {};

markets =
JSON.parse(localStorage.getItem("markets")) || [];

loadWallet();

updateGameLock();

}

}

);


// =====================================================
// 33. RESULT UPDATE SIGNAL
// =====================================================

window.addEventListener(
"resultUpdated",
function(){

updateGameLock();

}

);


console.log(
"✅ Compact Single Pana Final Connected"
);

</script>

<script>

"use strict";


/* =====================================================
   HR MATKA USER APP
   DEPOSIT.HTML
   FINAL COMPLETE ENGINE
===================================================== */



/* =====================================================
   1. GLOBAL
===================================================== */

let isSubmitting =
false;


let adminSettings =
{};


let minimumDeposit =
0;



/* =====================================================
   2. SAFE STORAGE
===================================================== */

function getStorage(
    key,
    fallback
){

    try{

        let raw =
        localStorage.getItem(
            key
        );


        if(
            raw === null ||
            raw === undefined ||
            raw === ""
        ){

            return fallback;

        }


        return JSON.parse(
            raw
        );

    }
    catch(error){

        console.error(
            "Storage Read Error:",
            key,
            error
        );


        return fallback;

    }

}



function saveStorage(
    key,
    value
){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(
                value
            )
        );


        return true;

    }
    catch(error){

        console.error(
            "Storage Save Error:",
            key,
            error
        );


        return false;

    }

}



/* =====================================================
   3. MOBILE NORMALIZE
===================================================== */

function normalizeMobile(value){

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    );

}



/* =====================================================
   4. STATUS NORMALIZE
===================================================== */

function normalizeStatus(value){

    return String(
        value || ""
    )
    .trim()
    .toLowerCase();

}



/* =====================================================
   5. CURRENT USER
===================================================== */

let currentUser =
getStorage(
    "currentUser",
    null
);


if(
    !currentUser ||
    !currentUser.mobile
){

    alert(
        "Please Login First"
    );


    window.location.href =
    "login.html";

}



/* =====================================================
   6. LINKS
===================================================== */

function goPage(page){

    window.location.href =
    page;

}



function goBack(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }

    else{

        window.location.href =
        "index.html";

    }

}



/* =====================================================
   7. FIND MOBILE KEY
===================================================== */

function findMobileKey(
    object,
    mobile
){

    if(
        !object ||
        typeof object !== "object" ||
        Array.isArray(
            object
        )
    ){

        return normalizeMobile(
            mobile
        );

    }


    let normalized =
    normalizeMobile(
        mobile
    );


    let found =
    Object.keys(
        object
    )
    .find(
        function(key){

            return (

                normalizeMobile(
                    key
                )

                ===

                normalized

            );

        }
    );


    return (
        found ||
        normalized
    );

}



/* =====================================================
   8. ADMIN SETTINGS
===================================================== */

function loadAdminSettings(){

    adminSettings =
    getStorage(
        "adminSettings",
        {}
    );


    minimumDeposit =
    Number(

        adminSettings.depositLimit

        ||

        adminSettings.minimumDeposit

        ||

        0

    );


    if(
        !Number.isFinite(
            minimumDeposit
        )
        ||
        minimumDeposit < 0
    ){

        minimumDeposit =
        0;

    }


    document
    .getElementById(
        "appTitle"
    )
    .innerText =

    adminSettings.appName

    ||

    "HR MATKA";


    document
    .getElementById(
        "upiId"
    )
    .value =

    adminSettings.upiId

    ||

    "";


    document
    .getElementById(
        "minDeposit"
    )
    .innerText =

    "₹" +
    minimumDeposit.toFixed(
        0
    );


    loadQRCode();

}



/* =====================================================
   9. QR CODE
===================================================== */

function loadQRCode(){

    let qrImage =
    document
    .getElementById(
        "qrImage"
    );


    let qrMissing =
    document
    .getElementById(
        "qrMissing"
    );


    if(
        adminSettings.qrCode
    ){

        qrImage.src =
        adminSettings.qrCode;


        qrImage.style.display =
        "inline-block";


        qrMissing.style.display =
        "none";

    }

    else{

        qrImage.removeAttribute(
            "src"
        );


        qrImage.style.display =
        "none";


        qrMissing.style.display =
        "block";

    }

}



/* =====================================================
   10. WALLET
===================================================== */

function refreshWallet(){

    let balances =
    getStorage(
        "userBalances",
        {}
    );


    if(
        !balances ||
        Array.isArray(
            balances
        ) ||
        typeof balances !==
        "object"
    ){

        balances = {};

    }


    let balanceKey =
    findMobileKey(
        balances,
        currentUser.mobile
    );


    let balance =
    Number(
        balances[
            balanceKey
        ] || 0
    );


    if(
        !Number.isFinite(
            balance
        )
    ){

        balance =
        0;

    }


    document
    .getElementById(
        "walletBalance"
    )
    .innerText =

        2
    );


    document
    .getElementById(

/* =====================================================
   11. COPY UPI
===================================================== */

async function copyUpi(){

    let upi =
    document
    .getElementById(
        "upiId"
    )
    .value
    .trim();


    if(!upi){

        alert(
            "UPI ID Not Available"
        );


        return;

    }


    try{

        if(
            navigator.clipboard &&
            navigator.clipboard.writeText
        ){

            await navigator.clipboard.writeText(
                upi
            );

        }

        else{

            throw new Error(
                "Clipboard Not Available"
            );

        }

    }

    catch(error){

        let input =
        document
        .getElementById(
            "upiId"
        );


        input.removeAttribute(
            "readonly"
        );


        input.select();


        document.execCommand(
            "copy"
        );


        input.setAttribute(
            "readonly",
            true
        );

    }


    alert(
        "UPI ID Copied"
    );

}



/* =====================================================
   12. EXACT AMOUNT INPUT

   type="text" hai.
   Scroll/wheel amount ko change nahi karega.
===================================================== */

function sanitizeDepositAmount(){

    let input =
    document
    .getElementById(
        "depositAmount"
    );


    input.value =
    String(
        input.value || ""
    )
    .replace(
        /\D/g,
        ""
    );


    updateAmountPreview();

}



/* =====================================================
   13. AMOUNT PREVIEW
===================================================== */

function updateAmountPreview(){

    let raw =
    document
    .getElementById(
        "depositAmount"
    )
    .value
    .trim();


    let amount =
    Number(
        raw
    );


    let box =
    document
    .getElementById(
        "amountPreview"
    );


    if(
        raw === ""
        ||
        !Number.isFinite(
            amount
        )
        ||
        amount <= 0
    ){

        box.classList.remove(
            "show"
        );


        return;

    }


    document
    .getElementById(
        "previewAmount"
    )
    .innerText =
    amount.toFixed(
        2
    );


    box.classList.add(
        "show"
    );

}



/* =====================================================
   14. UTR INPUT
===================================================== */

function sanitizeUTR(){

    let input =
    document
    .getElementById(
        "utrNumber"
    );


    input.value =
    String(
        input.value || ""
    )
    .replace(
        /\D/g,
        ""
    )
    .slice(
        0,
        12
    );

}



/* =====================================================
   15. SCREENSHOT PREVIEW
===================================================== */

function previewScreenshot(){

    let input =
    document
    .getElementById(
        "paymentScreenshot"
    );


    let file =
    input.files[0];


    let previewBox =
    document
    .getElementById(
        "previewBox"
    );


    let preview =
    document
    .getElementById(
        "screenshotPreview"
    );


    if(!file){

        previewBox.classList.remove(
            "show"
        );


        preview.removeAttribute(
            "src"
        );


        return;

    }


    if(
        !String(
            file.type || ""
        )
        .startsWith(
            "image/"
        )
    ){

        alert(
            "Please Select Valid Image"
        );


        input.value =
        "";


        previewBox.classList.remove(
            "show"
        );


        return;

    }


    let reader =
    new FileReader();


    reader.onload =
    function(event){

        preview.src =
        event.target.result;


        previewBox.classList.add(
            "show"
        );

    };


    reader.onerror =
    function(){

        alert(
            "Screenshot Preview Failed"
        );

    };


    reader.readAsDataURL(
        file
    );

}



/* =====================================================
   16. COMPRESS IMAGE
===================================================== */

function compressImage(file){

    return new Promise(
        function(resolve,reject){

            let reader =
            new FileReader();


            reader.onload =
            function(event){

                let image =
                new Image();


                image.onload =
                function(){

                    let maxWidth =
                    1100;


                    let maxHeight =
                    1100;


                    let width =
                    image.width;


                    let height =
                    image.height;


                    if(
                        width > maxWidth
                        ||
                        height > maxHeight
                    ){

                        let ratio =
                        Math.min(
                            maxWidth / width,
                            maxHeight / height
                        );


                        width =
                        Math.round(
                            width *
                            ratio
                        );


                        height =
                        Math.round(
                            height *
                            ratio
                        );

                    }


                    let canvas =
                    document.createElement(
                        "canvas"
                    );


                    canvas.width =
                    width;


                    canvas.height =
                    height;


                    let ctx =
                    canvas.getContext(
                        "2d"
                    );


                    if(!ctx){

                        reject(
                            new Error(
                                "Canvas Not Available"
                            )
                        );


                        return;

                    }


                    ctx.drawImage(
                        image,
                        0,
                        0,
                        width,
                        height
                    );


                    let dataUrl =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.72
                    );


                    resolve(
                        dataUrl
                    );

                };


                image.onerror =
                function(){

                    reject(
                        new Error(
                            "Image Load Failed"
                        )
                    );

                };


                image.src =
                event.target.result;

            };


            reader.onerror =
            function(){

                reject(
                    new Error(
                        "File Read Failed"
                    )
                );

            };


            reader.readAsDataURL(
                file
            );

        }
    );

}



/* =====================================================
   17. GET DEPOSITS
===================================================== */

function getDeposits(){

    let deposits =
    getStorage(
        "deposits",
        []

    return Array.isArray(
        deposits
    )
    ?
    deposits
    :
    [];

}



/* =====================================================
   18. CURRENT USER RECORD MATCH
===================================================== */

function isCurrentUserRecord(item){

    return (

        normalizeMobile(
            item.mobile
        )

        ===

        normalizeMobile(
            currentUser.mobile
        )

    );

}



/* =====================================================
   19. PENDING DEPOSIT
===================================================== */

function getPendingDeposit(){

    let deposits =
    getDeposits();


    return deposits.find(
        function(item){

            if(
                !isCurrentUserRecord(
                    item
                )
            ){

                return false;

            }


            let status =
            normalizeStatus(
                item.status
            );


            if(
                status !==
                "pending"
            ){

                return false;

            }


            let type =
            String(
                item.type || ""
            )
            .toLowerCase();


            return (

                type.includes(
                    "deposit"
                )

                ||

                item.utr

                ||

                item.requestId

            );

        }
    );

}



/* =====================================================
   20. PENDING DISPLAY
===================================================== */

function showPendingDeposit(){

    let pending =
    getPendingDeposit();


    let box =
    document
    .getElementById(
        "pendingBox"
    );


    if(!pending){

        box.classList.remove(
            "show"
        );


        box.innerHTML =
        "";


        return;

    }


    let amount =
    Number(
        pending.amount || 0
    );


    if(
        !Number.isFinite(
            amount
        )
    ){

        amount =
        0;

    }


    box.innerHTML =

    "Previous Deposit Request Pending"

    +

    "<br>Amount : ₹"

    +

    amount.toFixed(2)

    +

    "<br>UTR : "

    +

    (
        pending.utr ||
        "-"
    )

    +

    "<br>Request ID : "

    +

    (
        pending.requestId ||
        pending.id ||
        "-"
    );


    box.classList.add(
        "show"
    );

}



/* =====================================================
   21. DUPLICATE UTR
===================================================== */

function isDuplicateUTR(
    deposits,
    utr
){

    return deposits.some(
        function(item){

            return (

                String(
                    item.utr || ""
                )
                .trim()

                ===

                String(
                    utr || ""
                )
                .trim()

            );

        }
    );

}



/* =====================================================
   22. DATE + TIME
===================================================== */

function getCurrentDateTime(){

    let now =
    new Date();


    let time =
    now.toLocaleTimeString(
        "en-US",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    )
    .replace(
        /\bam\b/gi,
        "AM"
    )
    .replace(
        /\bpm\b/gi,
        "PM"
    );


    return {

        date:
        now.toLocaleDateString(
            "en-GB"
        ),

        time:
        time,

        timestamp:
        now.getTime(),

        iso:
        now.toISOString()

    };

}



/* =====================================================
   23. SUBMIT DEPOSIT
===================================================== */

async function submitDeposit(){

    if(isSubmitting){

        return;

    }


    let amountText =
    document
    .getElementById(
        "depositAmount"
    )
    .value
    .trim();


    let amount =
    Number(
        amountText
    );


    let utr =
    document
    .getElementById(
        "utrNumber"
    )
    .value
    .trim();


    let fileInput =
    document
    .getElementById(
        "paymentScreenshot"
    );


    let file =
    fileInput.files[0];


    /* =================================================
       EXACT AMOUNT VALIDATION
    ================================================= */

    if(
        amountText === ""
        ||
        !Number.isFinite(
            amount
        )
        ||
        amount <= 0
        ||
        !Number.isInteger(
            amount
        )
    ){

        alert(
            "Enter Valid Deposit Amount"
        );


        return;

    }



    if(
        amount <
        minimumDeposit
    ){

        alert(

            "Minimum Deposit ₹"

            +

            minimumDeposit

        );


        return;

    }



    if(
        utr.length !==
        12
    ){

        alert(
            "Enter Valid 12 Digit UTR Number"
        );


        return;

    }



    if(!file){

        alert(
            "Upload Payment Screenshot"
        );


        return;

    }



    if(
        !String(
            file.type || ""
        )
        .startsWith(
            "image/"
        )
    ){

        alert(
            "Please Upload Valid Payment Screenshot"
        );


        return;

    }



    let pending =
    getPendingDeposit();


    if(pending){

        alert(
            "Your Previous Deposit Request Is Pending"
        );


        showPendingDeposit();


        return;

    }



    let deposits =
    getDeposits();



    if(
        isDuplicateUTR(
            deposits,
            utr
        )
    ){

        alert(
            "This UTR Number Is Already Used"
        );


        return;

    }



    let confirmed =
    confirm(

        "Deposit Request Confirm Karein?"

        +

        "\n\nAmount: ₹ "

        +

        amount.toFixed(2)

        +

        "\nUTR: "

        +

        utr

    );


    if(!confirmed){

        return;

    }



    isSubmitting =
    true;


    let submitBtn =
    document
    .getElementById(
        "submitDepositBtn"
    );


    submitBtn.disabled =
    true;


    submitBtn.innerText =
    "PROCESSING...";



    try{


        /*
           Confirm ke baad fresh deposits read.
        */

        deposits =
        getDeposits();


        if(
            getPendingDeposit()
        ){

            alert(
                "Your Previous Deposit Request Is Pending"
            );


            return;

        }


        if(
            isDuplicateUTR(
                deposits,
                utr
            )
        ){

            alert(
                "This UTR Number Is Already Used"
            );


            return;

        }



        let screenshotData =
        await compressImage(
            file
        );



        /*
           SINGLE TIMESTAMP:
           id + requestId same transaction base use करेंगे.
        */

        let dateTime =
        getCurrentDateTime();


        let requestId =

        "DEP"

        +

        dateTime.timestamp;



        let depositRecord = {

            id:
            dateTime.timestamp,

            requestId:
            requestId,

            transactionId:
            requestId,

            referenceId:
            requestId,

            type:
            "User Deposit Request",

            source:
            "deposit.html",

            name:
            currentUser.name ||
            "",

            username:
            currentUser.name ||
            "",

            mobile:
            normalizeMobile(
                currentUser.mobile
            ),

            amount:
            amount,

            utr:
            utr,

            screenshotName:
            file.name,

            screenshotType:
            file.type ||
            "image/jpeg",

            screenshotData:
            screenshotData,

            status:
            "Pending",

            requestDate:
            dateTime.date,

            requestTime:
            dateTime.time,

            date:
            dateTime.date,

            time:
            dateTime.time,

            timestamp:
            dateTime.timestamp,

            createdTimestamp:
            dateTime.timestamp,

            createdAt:
            dateTime.iso,

            walletCredited:
            false

        };



        deposits.push(
            depositRecord
        );



        let saved =
        saveStorage(
            "deposits",
            deposits
        );



        if(!saved){

            alert(
                "Deposit Request Save Failed"
            );


            return;

        }



        localStorage.setItem(
            "lastDepositRequest",
            JSON.stringify({

                requestId:
                requestId,

                mobile:
                normalizeMobile(
                    currentUser.mobile
                ),

                amount:
                amount,

                utr:
                utr,

                status:
                "Pending",

                timestamp:
                dateTime.timestamp

            })
        );



        window.dispatchEvent(
            new Event(
                "depositUpdated"
            )
        );



        alert(

            "Deposit Request Submitted Successfully"

            +

            "\n\nAmount: ₹ "

            +

            amount.toFixed(2)

            +

            "\nRequest ID: "

            +

            requestId

        );



        document
        .getElementById(
            "depositAmount"
        )
        .value =
        "";


        document
        .getElementById(
            "utrNumber"
        )
        .value =
        "";


        fileInput.value =
        "";


        document
        .getElementById(
            "previewBox"
        )
        .classList
        .remove(
            "show"
        );


        document
        .getElementById(
            "screenshotPreview"
        )
        .removeAttribute(
            "src"
        );


        updateAmountPreview();


        showPendingDeposit();



        console.log(
            "✅ Deposit Request Saved",
            depositRecord
        );


    }
    catch(error){

        console.error(
            "Deposit Error:",
            error
        );


        alert(
            "Payment Screenshot Could Not Be Saved"
        );

    }

    finally{

        isSubmitting =
        false;


        submitBtn.disabled =
        false;


        submitBtn.innerText =
        "Submit Deposit";

    }

}

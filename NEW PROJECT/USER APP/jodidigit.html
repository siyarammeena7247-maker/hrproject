

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jodi Digit</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
}

.topBar{
height:70px;
background:#1d1d1d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
}

.backBtn{
font-size:32px;
font-weight:bold;
cursor:pointer;
}

.marketTitle{
font-size:20px;
font-weight:bold;
text-align:center;
flex:1;
}

.walletBox{
background:#2d2d2d;
padding:8px 15px;
border-radius:25px;
font-weight:bold;
color:#FFD54F;
}

.dateSection{
display:flex;
gap:10px;
padding:12px;
}

.dateBox,
.sessionBox{
flex:1;
height:50px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
font-size:18px;
font-weight:bold;
}

.dateBox{
background:#1c1c1c;
border:2px solid #FFD54F;
}

.sessionBox{
background:#1c1c1c;
color:#00ff66;
border:2px solid #00ff66;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
color:#000;
padding:20px;
border-radius:12px;
}

h1{
text-align:center;
color:#d32f2f;
margin-bottom:8px;
}

h2{
text-align:center;
margin-bottom:20px;
}

.wallet{
background:#4CAF50;
color:#fff;
padding:15px;
border-radius:10px;
text-align:center;
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="topBar">

<div class="backBtn" onclick="history.back()">
←
</div>

<div class="marketTitle" id="marketTitle">
Loading...
</div>

<div class="walletBox">
₹ <span id="topWallet">0</span>
</div>

</div>

<div class="dateSection">

<div class="dateBox">
<span id="todayDate">
00-00-0000
</span>
</div>

<div class="sessionBox">
<span id="sessionType">
Loading...
</span>
</div>

</div>

<div class="container">

<div class="card">

<h1>
HR MATKA
</h1>

<h2>
Jodi Digit
</h2>

<div class="wallet">

Wallet Balance

<br><br>

₹ <span id="wallet">0</span>

</div>


<!-- ========================= -->
<!-- JODI TABLE -->
<!-- ========================= -->

<style>

.jodiTable{
margin-top:20px;
height:420px;
overflow-y:auto;
padding-right:5px;
}

.jodiTable::-webkit-scrollbar{
width:6px;
}

.jodiTable::-webkit-scrollbar-thumb{
background:#2196F3;
border-radius:10px;
}

.jodiRow{
display:flex;
gap:10px;
margin-bottom:10px;
}

.jodiBox{
width:90px;
height:45px;
background:#1976D2;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
font-size:18px;
font-weight:bold;
border-radius:8px;
}

.pointInput{
flex:1;
height:45px;
padding:10px;
font-size:17px;
border:2px solid #2196F3;
border-radius:8px;
outline:none;
}

.pointInput:focus{
border-color:#FFD54F;
}

.totalBox{
margin-top:15px;
font-size:22px;
font-weight:bold;
text-align:center;
}

#submitBtn{
width:100%;
height:50px;
margin-top:20px;
background:#d32f2f;
color:white;
border:none;
border-radius:10px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

</style>

<div class="jodiTable" id="jodiTable">

</div>

<div class="totalBox">

Total Points :

<span id="totalPoints">0</span>

</div>

<button id="submitBtn">

Submit Bid

</button>

<br><br>

<a href="marketgame.html">

⬅ Back

</a>




<script>



// ===================================
// JODI DIGIT
// PART-3
// AUTO CREATE 00 TO 99
// ===================================

const jodiTable =
document.getElementById("jodiTable");

for(let i=0;i<=99;i++){

let jodi =
String(i).padStart(2,"0");

jodiTable.innerHTML += `

<div class="jodiRow">

<div class="jodiBox">

${jodi}

</div>

<input
type="number"
class="pointInput"
data-jodi="${jodi}"
placeholder="Enter Points"
min="0"
>

</div>

`;

}





// ===================================
// JODI DIGIT
// PART-4
// AUTO TOTAL POINTS
// ===================================

let totalPoints = 0;

function calculateTotal(){

    totalPoints = 0;

    document.querySelectorAll(".pointInput").forEach(function(input){

        let value = Number(input.value) || 0;

        totalPoints += value;

    });

    document.getElementById("totalPoints").innerHTML = totalPoints;

}

// Auto Update
document.addEventListener("input",function(e){

    if(e.target.classList.contains("pointInput")){

        calculateTotal();

    }

});






// ===================================
// JODI DIGIT
// PART-5
// USER + WALLET + MARKET
// ===================================

let currentUser =
JSON.parse(localStorage.getItem("currentUser")) || {};

let balances =
JSON.parse(localStorage.getItem("userBalances")) || {};

let markets =
JSON.parse(localStorage.getItem("markets")) || [];

let currentMarket = null;

// -----------------------
// Load Wallet
// -----------------------

function loadWallet(){

    if(!currentUser.mobile){

        alert("Please Login First");

        window.location.href="login.html";

        return;

    }

    let wallet =
    Number(balances[currentUser.mobile] || 0);

    document.getElementById("wallet").innerHTML = wallet;

    document.getElementById("topWallet").innerHTML = wallet;

}

// -----------------------
// Load Market
// -----------------------

function loadMarket(){

    const params =
    new URLSearchParams(window.location.search);

    const market =
    params.get("market");

    currentMarket =
    markets.find(m => m.market == market);


    if(!currentMarket){

    currentMarket = {

        market:"TEST MARKET",

        manualStatus:"OPEN"

    };

}



    if(!currentMarket){

        document.getElementById("marketTitle").innerHTML =
        "No Market";

        return;

    }

    document.getElementById("marketTitle").innerHTML =
    currentMarket.market;

}

// -----------------------
// Load Date
// -----------------------

function loadTodayDate(){

    let today = new Date();

    document.getElementById("todayDate").innerHTML =
    today.toLocaleDateString("en-GB");

}

// -----------------------
// Start
// -----------------------

loadWallet();

loadMarket();

loadTodayDate();






// ===================================
// JODI DIGIT
// PART-6
// SUBMIT BUTTON + VALIDATION
// ===================================

document
.getElementById("submitBtn")
.addEventListener("click",submitBid);

function submitBid(){

    calculateTotal();

    if(totalPoints<=0){

        alert("Please Enter Points");

        return;

    }

    if(totalPoints<10){

        alert("Minimum Bid 10 Points");

        return;

    }

    let wallet =
    Number(balances[currentUser.mobile] || 0);

    if(totalPoints>wallet){

        alert("Insufficient Wallet Balance");

        return;

    }



    // Wallet Deduct

let previousBalance = wallet;

wallet -= totalPoints;

balances[currentUser.mobile] = wallet;

localStorage.setItem(
"userBalances",
JSON.stringify(balances)
);

loadWallet();

// Date & Time

let now = new Date();

let date =
now.toLocaleDateString("en-GB");

let time =
now.toLocaleTimeString();

// Game Name

let gameName = "Jodi Digit";

// Bets

let bets =
JSON.parse(localStorage.getItem("bets")) || [];

document.querySelectorAll(".jodiRow").forEach(function(row){

    let amount =
    Number(row.querySelector(".pointInput").value);

    let jodi =
    row.querySelector(".jodiBox").innerText;

    if(amount>0){

        bets.push({

            id:Date.now()+Math.random(),

            mobile:currentUser.mobile,

            name:currentUser.name,

            market:currentMarket.market,

            game:gameName,

            number:jodi,

            amount:amount,

            date:date,

            time:time,

            status:"Pending"

        });

    }

});

localStorage.setItem(
"bets",
JSON.stringify(bets)
);



// ===================================
// TODAY PLAY
// ===================================

let todayPlay =
JSON.parse(localStorage.getItem("todayPlay")) || [];

todayPlay.push({

    mobile: currentUser.mobile,

    market: currentMarket.market,

    game: gameName,

    amount: totalPoints,

    date: date

});

localStorage.setItem(
"todayPlay",
JSON.stringify(todayPlay)
);

// ===================================
// PASSBOOK
// ===================================

let passbook =
JSON.parse(localStorage.getItem("passbook")) || [];

passbook.push({

    mobile: currentUser.mobile,

    date: date,

    time: time,

    type: "Game Play",

    previousBalance: previousBalance,

    amount: totalPoints,

    currentBalance: wallet,

    status: "Success",

    details: currentMarket.market + " - " + gameName

});

localStorage.setItem(
"passbook",
JSON.stringify(passbook)
);

// ===================================
// CLEAR INPUTS
// ===================================

document.querySelectorAll(".pointInput").forEach(function(input){

    input.value = "";

});

calculateTotal();

loadWallet();

alert("Jodi Digit Bid Submitted Successfully");


alert("Bid Submitted Successfully");

}





// ===================================
// JODI DIGIT
// PART-9
// MARKET STATUS CONTROL
// ===================================

function updateGameStatus(){

    if(!currentMarket) return;

    let resultData =
    JSON.parse(localStorage.getItem("results")) || [];

    let marketResult =
    resultData.find(r => r.market == currentMarket.market);

    let session =
    document.getElementById("sessionType");

    let submitBtn =
    document.getElementById("submitBtn");

    let inputs =
    document.querySelectorAll(".pointInput");

    // Default
    session.innerHTML = "OPEN";

    submitBtn.disabled = false;

    inputs.forEach(function(input){
        input.disabled = false;
    });

    // Holiday
    if(currentMarket.manualStatus === "HOLIDAY"){

        session.innerHTML = "HOLIDAY";

        submitBtn.disabled = true;

        inputs.forEach(function(input){
            input.disabled = true;
        });

        return;
    }

    if(marketResult){

        // Open Result आने के बाद Jodi बंद
        if(marketResult.open && marketResult.open !== "***"){

            session.innerHTML = "CLOSE RUNNING";

            submitBtn.disabled = true;

            inputs.forEach(function(input){
                input.disabled = true;
            });

        }

        // Close Result आने के बाद पूरा Market बंद
        if(marketResult.close && marketResult.close !== "***"){

            session.innerHTML = "MARKET CLOSED";

            submitBtn.disabled = true;

            inputs.forEach(function(input){
                input.disabled = true;
            });

        }

    }

}

updateGameStatus();

setInterval(updateGameStatus,3000);














</script>

<script>

"use strict";


/* =====================================================
   1. STORAGE
===================================================== */

function getStorage(
    key,
    fallback
){

    try{

        let data =
        localStorage.getItem(
            key
        );


        if(!data){

            return fallback;

        }


        return JSON.parse(
            data
        );

    }
    catch(error){

        console.log(
            "Storage Error:",
            error
        );


        return fallback;

    }

}



function saveStorage(
    key,
    value
){

    localStorage.setItem(
        key,
        JSON.stringify(
            value
        )
    );

}



/* =====================================================
   2. CAPITAL AM / PM TIME
===================================================== */

function formatTimeAMPM(
    date = new Date()
){

    return date
    .toLocaleTimeString(
        "en-US",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    )
    .replace(
        " am",
        " AM"
    )
    .replace(
        " pm",
        " PM"
    );

}



/* =====================================================
   3. DATE
===================================================== */

function formatDate(
    date = new Date()
){

    return date
    .toLocaleDateString(
        "en-GB",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}



/* =====================================================
   4. FULL DATE + CAPITAL AM PM
===================================================== */

function formatDateTimeAMPM(
    date = new Date()
){

    return (
        formatDate(
            date
        )
        +
        ", "
        +
        formatTimeAMPM(
            date
        )
    );

}



/* =====================================================
   5. CURRENT USER
===================================================== */

let currentUser =
getStorage(
    "currentUser",
    null
);


if(
    !currentUser ||
    !currentUser.mobile
){

    alert(
        "Please Login First"
    );


    window.location.href =
    "login.html";

}



/* =====================================================
   6. PAGE LINKS
===================================================== */

function goPage(
    page
){

    window.location.href =
    page;

}



function goBack(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }
    else{

        window.location.href =
        "index.html";

    }

}



/* =====================================================
   7. ADMIN SETTINGS
===================================================== */

let adminSettings =
getStorage(
    "adminSettings",
    {}
);


let minimumWithdraw =
Number(
    adminSettings.withdrawLimit
    ||
    adminSettings.minimumWithdraw
    ||
    0
);


document.getElementById(
    "minWithdraw"
).innerText =
"₹ " +
minimumWithdraw;


document.getElementById(
    "appName"
).innerText =
adminSettings.appName
||
"HR MATKA";



/* =====================================================
   8. CAPITALIZATION
===================================================== */

function capitalizeWords(
    value
){

    return String(
        value || ""
    )
    .toLowerCase()
    .replace(
        /\b\w/g,
        function(letter){

            return letter
            .toUpperCase();

        }
    );

}



document.getElementById(
    "holderName"
)
.addEventListener(
    "input",
    function(){

        let position =
        this.selectionStart;


        this.value =
        capitalizeWords(
            this.value
        );


        try{

            this.setSelectionRange(
                position,
                position
            );

        }
        catch(error){}

    }
);



document.getElementById(
    "bankName"
)
.addEventListener(
    "input",
    function(){

        let position =
        this.selectionStart;


        this.value =
        capitalizeWords(
            this.value
        );


        try{

            this.setSelectionRange(
                position,
                position
            );

        }
        catch(error){}

    }
);



document.getElementById(
    "ifscCode"
)
.addEventListener(
    "input",
    function(){

        this.value =
        this.value
        .toUpperCase()
        .replace(
            /\s/g,
            ""
        );

    }
);



document.getElementById(
    "accountNumber"
)
.addEventListener(
    "input",
    function(){

        this.value =
        this.value.replace(
            /\D/g,
            ""
        );

    }
);



document.getElementById(
    "withdrawAmount"
)
.addEventListener(
    "input",
    function(){

        this.value =
        this.value.replace(
            /\D/g,
            ""
        );

    }
);



/* =====================================================
   9. WALLET
===================================================== */

let walletBalance = 0;


function refreshWallet(){

    let balances =
    getStorage(
        "userBalances",
        {}
    );


    walletBalance =
    Number(
        balances[
            currentUser.mobile
        ] || 0
    );


    if(
        !Number.isFinite(
            walletBalance
        )
    ){

        walletBalance = 0;

    }


    document.getElementById(
        "walletBalance"
    ).innerText =
    walletBalance
    .toFixed(
        2
    );


    document.getElementById(
        "topWallet"
    ).innerText =
    walletBalance
    .toFixed(
        2
    );

}



/* =====================================================
   10. IMPORT OLD PAYMENT DETAILS
===================================================== */

function importOldDetails(){

    let userPaymentDetails =
    getStorage(
        "userPaymentDetails",
        {}
    );


    if(
        userPaymentDetails[
            currentUser.mobile
        ]
    ){

        return;

    }


    let bankDetails =
    getStorage(
        "bankDetails",
        {}
    );


    let upiDetails =
    getStorage(
        "upiDetails",
        {}
    );


    let oldBank =
    bankDetails[
        currentUser.mobile
    ] || {};


    let oldUpi =
    upiDetails[
        currentUser.mobile
    ] || {};


    if(
        oldBank.holder
        ||
        oldBank.bank
        ||
        oldBank.number
        ||
        oldBank.ifsc
        ||
        oldUpi.upiId
    ){

        userPaymentDetails[
            currentUser.mobile
        ] = {

            holderName:
            oldBank.holder || "",

            bankName:
            oldBank.bank || "",

            accountNumber:
            oldBank.number || "",

            ifscCode:
            oldBank.ifsc || "",

            upiId:
            oldUpi.upiId || ""

        };


        saveStorage(
            "userPaymentDetails",
            userPaymentDetails
        );

    }

}



/* =====================================================
   11. LOAD PAYMENT DETAILS
===================================================== */

function loadPaymentDetails(){

    let userPaymentDetails =
    getStorage(
        "userPaymentDetails",
        {}
    );


    let details =
    userPaymentDetails[
        currentUser.mobile
    ] || {};


    document.getElementById(
        "holderName"
    ).value =
    details.holderName
    || "";


    document.getElementById(
        "bankName"
    ).value =
    details.bankName
    || "";


    document.getElementById(
        "accountNumber"
    ).value =
    details.accountNumber
    || "";


    document.getElementById(
        "ifscCode"
    ).value =
    details.ifscCode
    || "";


    document.getElementById(
        "upiId"
    ).value =
    details.upiId
    || "";

}



/* =====================================================
   12. PAYMENT FORM DATA
===================================================== */

function getPaymentFormData(){

    let holderName =
    document.getElementById(
        "holderName"
    )
    .value
    .trim();


    let bankName =
    document.getElementById(
        "bankName"
    )
    .value
    .trim();


    let accountNumber =
    document.getElementById(
        "accountNumber"
    )
    .value
    .trim();


    let ifscCode =
    document.getElementById(
        "ifscCode"
    )
    .value
    .trim()
    .toUpperCase();


    let upiId =
    document.getElementById(
        "upiId"
    )
    .value
    .trim();


    let bankAvailable =

    holderName !== ""
    &&
    bankName !== ""
    &&
    accountNumber !== ""
    &&
    ifscCode !== "";


    let upiAvailable =
    upiId !== "";


    return {

        holderName,

        bankName,

        accountNumber,

        ifscCode,

        upiId,

        bankAvailable,

        upiAvailable

    };

}



/* =====================================================
   13. SAVE PAYMENT DETAILS
===================================================== */

function savePaymentDetails(
    showMessage = true
){

    let form =
    getPaymentFormData();


    if(
        !form.bankAvailable
        &&
        !form.upiAvailable
    ){

        alert(
            "Please Enter Full Bank Details Or UPI ID"
        );

        return false;

    }


    let anyBankField =

    form.holderName !== ""
    ||
    form.bankName !== ""
    ||
    form.accountNumber !== ""
    ||
    form.ifscCode !== "";


    if(
        anyBankField
        &&
        !form.bankAvailable
        &&
        !form.upiAvailable
    ){

        alert(
            "Please Complete Bank Details Or Enter UPI ID"
        );

        return false;

    }


    let userPaymentDetails =
    getStorage(
        "userPaymentDetails",
        {}
    );


    userPaymentDetails[
        currentUser.mobile
    ] = {

        holderName:
        form.holderName,

        bankName:
        form.bankName,

        accountNumber:
        form.accountNumber,

        ifscCode:
        form.ifscCode,

        upiId:
        form.upiId,

        updatedAt:
        formatDateTimeAMPM(
            new Date()
        )

    };


    saveStorage(
        "userPaymentDetails",
        userPaymentDetails
    );


    let bankDetails =
    getStorage(
        "bankDetails",
        {}
    );


    bankDetails[
        currentUser.mobile
    ] = {

        holder:
        form.holderName,

        bank:
        form.bankName,

        number:
        form.accountNumber,

        ifsc:
        form.ifscCode

    };


    saveStorage(
        "bankDetails",
        bankDetails
    );


    let upiDetails =
    getStorage(
        "upiDetails",
        {}
    );


    upiDetails[
        currentUser.mobile
    ] = {

        upiId:
        form.upiId

    };


    saveStorage(
        "upiDetails",
        upiDetails
    );


    if(
        showMessage
    ){

        alert(
            "Account Details Saved Successfully"
        );

    }


    return true;

}



/* =====================================================
   14. GET PENDING REQUEST
===================================================== */

function getPendingRequest(){

    let withdrawals =
    getStorage(
        "withdrawals",
        []
    );


    if(
        !Array.isArray(
            withdrawals
        )
    ){

        withdrawals = [];

    }


    return withdrawals.find(
        function(item){

            return (

                String(
                    item.mobile
                )
                ===
                String(
                    currentUser.mobile
                )

                &&

                String(
                    item.status
                )
                .toLowerCase()
                ===
                "pending"

            );

        }
    );

}



/* =====================================================
   15. PENDING DISPLAY
===================================================== */

function showPendingRequest(){

    let pending =
    getPendingRequest();


    let box =
    document.getElementById(
        "pendingRequestBox"
    );


    if(!pending){

        box.classList.remove(
            "show"
        );


        box.innerHTML =
        "";


        return;

    }


    let requestDate =
    pending.requestDate
    ||
    "";


    let requestTime =
    pending.requestTime
    ||
    pending.time
    ||
    "";


    /*
       Old record compatibility
       only display purpose.
    */

    if(
        !requestDate
        &&
        pending.date
    ){

        let text =
        String(
            pending.date
        );


        if(
            text.includes(
                ","
            )
        ){

            let parts =
            text.split(
                ","
            );


            requestDate =
            parts[0]
            .trim();


            if(
                !requestTime
            ){

                requestTime =
                parts
                .slice(1)
                .join(",")
                .trim();

            }

        }
        else{

            requestDate =
            text;

        }

    }


    let dateTimeText =
    requestDate || "-";


    if(
        requestTime
    ){

        dateTimeText +=
        ", "
        +
        requestTime;

    }


    box.innerHTML =

    "Previous Request Pending"
    +
    "<br>"
    +
    "Amount : ₹"
    +
    Number(
        pending.amount || 0
    )
    .toFixed(
        2
    )
    +
    "<br>"
    +
    "Date : "
    +
    dateTimeText;


    box.classList.add(
        "show"
    );

}



/* =====================================================
   16. SUBMIT WITHDRAW
===================================================== */

function submitWithdraw(){

    refreshWallet();


    let amount =
    Number(
        document.getElementById(
            "withdrawAmount"
        ).value
    );


    if(
        !amount
        ||
        amount <= 0
    ){

        alert(
            "Please Enter Valid Amount"
        );

        return;

    }


    if(
        amount <
        minimumWithdraw
    ){

        alert(
            "Minimum Withdraw ₹ "
            +
            minimumWithdraw
        );

        return;

    }


    if(
        amount >
        walletBalance
    ){

        alert(
            "Insufficient Wallet Balance"
        );

        return;

    }


    let pendingRequest =
    getPendingRequest();


    if(
        pendingRequest
    ){

        alert(
            "Your Previous Withdrawal Request Is Pending"
        );

        return;

    }


    let form =
    getPaymentFormData();


    if(
        !form.bankAvailable
        &&
        !form.upiAvailable
    ){

        alert(
            "Please Enter Bank Details Or UPI ID"
        );

        return;

    }


    if(
        !savePaymentDetails(
            false
        )
    ){

        return;

    }


    let paymentMode =
    "";


    if(
        form.bankAvailable
        &&
        form.upiAvailable
    ){

        paymentMode =
        "BANK + UPI";

    }
    else if(
        form.upiAvailable
    ){

        paymentMode =
        "UPI";

    }
    else{

        paymentMode =
        "BANK";

    }


    let withdrawals =
    getStorage(
        "withdrawals",
        []
    );


    if(
        !Array.isArray(
            withdrawals
        )
    ){

        withdrawals = [];

    }


    let now =
    new Date();


    let uniqueId =
    Date.now();


    let requestDate =
    formatDate(
        now
    );


    let requestTime =
    formatTimeAMPM(
        now
    );


    /*
       IMPORTANT

       New records:
       date = only date
       time = CAPITAL AM / PM time

       Also requestDate and requestTime
       are saved separately.
    */

    withdrawals.push({

        id:
        uniqueId,

        requestId:
        "WD"
        +
        uniqueId,

        type:
        "Withdrawal Request",

        name:
        currentUser.name
        || "",

        mobile:
        currentUser.mobile,

        holderName:
        form.holderName,

        bankName:
        form.bankName,

        accountNumber:
        form.accountNumber,

        ifsc:
        form.ifscCode,

        ifscCode:
        form.ifscCode,

        upi:
        form.upiId,

        upiId:
        form.upiId,

        paymentMode:
        paymentMode,

        amount:
        amount,

        requestDate:
        requestDate,

        requestTime:
        requestTime,

        date:
        requestDate,

        time:
        requestTime,

        createdAt:
        now.toISOString(),

        status:
        "Pending"

    });


    saveStorage(
        "withdrawals",
        withdrawals
    );


    alert(
        "Withdraw Request Submitted Successfully"
    );


    document.getElementById(
        "withdrawAmount"
    ).value =
    "";


    showPendingRequest();


    /*
       Wallet yahan deduct nahi hoga.
       Admin Approve par deduct hoga.
    */

}



/* =====================================================
   17. SUBMIT BUTTON
===================================================== */

document.getElementById(
    "withdrawBtn"
)
.addEventListener(
    "click",
    submitWithdraw
);



/* =====================================================
   18. LIVE UPDATE
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            "withdrawals"

            ||

            event.key ===
            "userBalances"

            ||

            event.key ===
            "adminSettings"
        ){

            refreshWallet();

            showPendingRequest();

        }

    }
);

===================================================== */

importOldDetails();

loadPaymentDetails();

refreshWallet();

showPendingRequest();



setInterval(
    function(){

        refreshWallet();

        showPendingRequest();

    },
    3000
);

);

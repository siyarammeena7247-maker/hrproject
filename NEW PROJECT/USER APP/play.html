

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Game</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:20px;
}

.market{

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 0 10px rgba(0,0,0,.2);

margin-bottom:20px;

}

.market h2{

color:#e53935;

margin-bottom:10px;

}

.info{

font-size:18px;

margin:8px 0;

}

.status{

display:inline-block;

padding:6px 15px;

background:green;

color:white;

border-radius:5px;

font-weight:bold;

}

button{

width:100%;

padding:12px;

margin-top:15px;

border:none;

background:#ff9800;

color:white;

font-size:18px;

border-radius:8px;

cursor:pointer;

}

button:hover{

background:#f57c00;

}

.back{

display:block;

text-align:center;

margin-top:20px;

text-decoration:none;

}

</style>

</head>

<body>

<div class="container">

<h1>Play Game</h1>

<div class="market">

<h2>HR MAIN MARKET</h2>

<div class="info">

Open Time :
<b>10:00 AM</b>

</div>

<div class="info">

Close Time :
<b>11:00 PM</b>

</div>

<div class="info">

Status :

<span class="status">

OPEN

</span>

</div>

<button onclick="openMarket()">

PLAY NOW

</button>

</div>

<a href="home.html" class="back">

⬅ Back To Home

</a>

</div>

<script>

function openMarket(){

window.location.href="marketgame.html";

}

</script>

</body>
</html>
